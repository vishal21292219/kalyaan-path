name: Reel Poster (scheduled FB/IG)

# Fires queued FB/IG reels at their exact target time (decoupled from generation,
# so slow renders never push a post off its peak). Tiny job (~1 min). Reads
# data/state/pending_reels.json, posts due records via the Make webhook, removes
# posted + stale ones. Times are GoM US peaks (UTC) + a safety sweep.
on:
  schedule:
    # Fire every 2h across the active window (17:00–07:00 UTC) so GitHub cron lag/
    # skips can't strand a queued reel — peaks 17/21/01 are included, and the
    # in-between runs (19/23/03/05/07) catch any missed peak within ~2h. A reel
    # posts at most once (posted-ledger), so extra runs are cheap no-ops.
    - cron: "0 17 * * *"   # 1 PM ET — GoM #1 peak
    - cron: "0 19 * * *"   # backstop
    - cron: "0 21 * * *"   # 5 PM ET — GoM #2 peak
    - cron: "0 23 * * *"   # backstop
    - cron: "0 1 * * *"    # 9 PM ET — GoM #3 peak
    - cron: "0 3 * * *"    # backstop
    - cron: "0 5 * * *"    # backstop
    - cron: "0 7 * * *"    # final sweep
  workflow_dispatch:

# The persist step commits the posted-ledger/queue back to main. Without write
# permission the push is REJECTED every run (the repo's default token is
# read-only), so the ledger froze → the poster re-fired already-posted reels
# forever and HELD every new one → FB got nothing for ~a day. Grant write so
# state actually lands.
permissions:
  contents: write

concurrency:
  group: reel-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests python-dotenv
      - name: Post due reels
        env:
          MAKE_REEL_WEBHOOK: ${{ secrets.MAKE_REEL_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post_pending_reels.py
      - name: Persist state (ledger MUST land — dedup guarantee)
        # Splits the ledger (critical, union-merged + 15 retries) from the queue
        # (best-effort). The old single bundled commit kept losing the git-push race,
        # so the "already posted" record never reached origin → the poster re-fired
        # the same reel (45× + a repeat dup). Now the ledger reliably lands → no re-post.
        run: python pipeline/persist_state.py
