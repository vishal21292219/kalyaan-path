name: Reel Poster (scheduled FB/IG)

# Fires queued FB/IG reels at their exact target time (decoupled from generation,
# so slow renders never push a post off its peak). Tiny job (~1 min). Reads
# data/state/pending_reels.json, posts due records via the Make webhook, removes
# posted + stale ones. Times are the channels' slots (UTC) + safety sweeps.
on:
  schedule:
    # Fire across the active window (17:00–07:00 UTC) so GitHub cron lag/skips
    # can't strand a queued post. A post fires at most once (posted-ledger), so
    # extra runs are cheap no-ops.
    # GoM slots MOVED 2026-10-24 (docs/fb-native-scheduling.md): scripted reel
    # 19:00 UTC (00:30 IST), photo / one-line reel 22:00 UTC (03:30 IST). The
    # 22:00 run was added for the photo; 23:00 is its backstop when the 3h
    # MIN_GAP guard holds it behind a late reel. The other runs are kept for the
    # remaining channels' slots and as backstops.
    - cron: "0 17 * * *"   # 1 PM ET — Money Neurons #1 slot / backstop
    - cron: "0 19 * * *"   # 00:30 IST — GoM scripted reel
    - cron: "0 21 * * *"   # 5 PM ET — backstop
    - cron: "0 22 * * *"   # 03:30 IST — GoM photo / one-line reel
    - cron: "0 23 * * *"   # backstop (GoM photo held by the gap guard)
    - cron: "0 1 * * *"    # 9 PM ET — Money Neurons #3 slot / backstop
    - cron: "0 3 * * *"    # backstop
    - cron: "0 5 * * *"    # backstop
    - cron: "0 7 * * *"    # final sweep
  workflow_dispatch:

# The persist step commits the posted-ledger/queue back to main. Without write
# permission the push is REJECTED every run (the repo's default token is
# read-only), so the ledger froze → the poster re-fired already-posted reels
# forever and HELD every new one → FB got nothing for ~a day. Grant write so
# state actually lands.
permissions:
  contents: write

concurrency:
  group: reel-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests python-dotenv
      - name: Post due reels
        env:
          MAKE_REEL_WEBHOOK: ${{ secrets.MAKE_REEL_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post_pending_reels.py
      - name: Persist state (ledger MUST land — dedup guarantee)
        # Splits the ledger (critical, union-merged + 15 retries) from the queue
        # (best-effort). The old single bundled commit kept losing the git-push race,
        # so the "already posted" record never reached origin → the poster re-fired
        # the same reel (45× + a repeat dup). Now the ledger reliably lands → no re-post.
        run: python pipeline/persist_state.py
