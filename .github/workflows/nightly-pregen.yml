# Nightly pre-generation — SCRIPTS-ONLY topic-reserve + preview for the next 2 days.
# Runs on the FREE stack only (Gemini/HF/Groq). It does NOT generate images or
# thumbnails: publish (daily-reels.yml / run.py) always makes images fresh on the
# paid stack (fal FLUX + character consistency + Kling), so there is nothing to
# pre-bake here. This job just drafts a Gemini script per upcoming slot so you get
# a nightly Telegram list of tomorrow's reserved topics to veto.
#
# Fires daily at 21:00 UTC = 02:30 IST (Asia/IND dead night) — Gemini-fast window.
#
# Output: data/pregenerated/{niche}/{YYYYMMDD}_{kind}_s{seed}/
#   ├─ script.json   (Gemini draft — preview only; publish regenerates with Claude)
#   └─ meta.json     (scripts_only: true, images_count: 0)
#
# Schedule state: data/state/upload_schedule.json (committed back to repo)
#
name: Nightly Pregen (free scripts-only preview)

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 02:30 IST every day
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to pre-gen"
        required: false
        default: "2"
      cleanup:
        description: "Also sweep consumed/old pregen dirs"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  pregen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # No ffmpeg/fonts needed — scripts-only pregen renders no images or video.

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Restore secrets to .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=$GEMINI_API_KEY
          HUGGINGFACE_TOKEN=$HUGGINGFACE_TOKEN
          GROQ_API_KEY=$GROQ_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          EOF

      - name: Run nightly pregen
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          CLEANUP="${{ github.event.inputs.cleanup || 'true' }}"
          if [ "$CLEANUP" = "true" ]; then
            python run_pregen.py --days $DAYS --cleanup
          else
            python run_pregen.py --days $DAYS
          fi

      - name: Commit pregen state + assets
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add data/state/upload_schedule.json || true
          git add data/pregenerated/ || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: nightly pregen results [skip ci]"
            git push || true
          else
            echo "no pregen changes to commit"
          fi
