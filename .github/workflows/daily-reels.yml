# Move to .github/workflows/daily-reels.yml in your GitHub repo.
#
# Daily auto-pipeline (4 runs/day):
#   06:00 IST → Itihaasvani video 1  (Telegram drop, manual upload)
#   06:15 IST → Itihaasvani video 2  (Telegram drop, different topic)
#   07:00 IST → KalyaanPath shloka   (auto-publish to YouTube)
#   19:00 IST → KalyaanPath trending (auto-publish to YouTube)
#
# Free Actions tier (private repo): 2000 min/mo. ~15 min × 4 × 30 = 1800 min.
# If you make the repo public, Actions are unlimited free.
name: Daily Reels (Itihaasvani + KalyaanPath)

on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST → itihaas Telegram drop #1
    - cron: "45 0 * * *"    # 06:15 IST → itihaas Telegram drop #2
    - cron: "30 1 * * *"    # 07:00 IST → bhakti shloka publish
    - cron: "30 13 * * *"   # 19:00 IST → bhakti trending publish
    - cron: "0 14 * * *"    # 19:30 IST = 14:00 UTC → ancient (TimeDecoders) auto-publish (US afternoon + EU evening)
    - cron: "30 2 * * 0"    # 08:00 IST Sunday → itihaas LONG-FORM (20-25 min) weekly auto-publish + GitHub Release
  workflow_dispatch:
    inputs:
      niche:
        description: "Which niche to run manually"
        required: true
        default: "itihaas"
        type: choice
        options: [bhakti, itihaas, ancient]
      kind:
        description: "Which kind"
        required: true
        default: "trending"
        type: choice
        options: [shloka, trending]
      mode:
        description: "publish (auto-YT) or telegram (manual)"
        required: true
        default: "telegram"
        type: choice
        options: [publish, telegram]
      long_form:
        description: "Generate long-form 20-25 min video (Sunday weekly mode)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      seed_offset:
        description: "Topic variation offset"
        required: false
        default: "0"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + Devanagari fonts (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk fonts-lohit-deva fontconfig
          fc-cache -f

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model (skipped if silence-align works)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-medium-v1

      - name: Restore OAuth + Telegram secrets to .env
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_ANCIENT_TOKEN_JSON: ${{ secrets.YT_ANCIENT_TOKEN_JSON }}
          YT_ANCIENT_CLIENT_SECRET_JSON: ${{ secrets.YT_ANCIENT_CLIENT_SECRET_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          mkdir -p secrets
          [ -n "$YT_TOKEN_JSON" ] && echo "$YT_TOKEN_JSON" > secrets/youtube_token.json
          [ -n "$YT_CLIENT_SECRET_JSON" ] && echo "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          [ -n "$YT_ANCIENT_TOKEN_JSON" ] && echo "$YT_ANCIENT_TOKEN_JSON" > secrets/ancient_youtube_token.json
          [ -n "$YT_ANCIENT_CLIENT_SECRET_JSON" ] && echo "$YT_ANCIENT_CLIENT_SECRET_JSON" > secrets/ancient_youtube_client_secret.json
          cat > .env <<EOF
          GEMINI_API_KEY=$GEMINI_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          IG_USER_ID=$IG_USER_ID
          IG_ACCESS_TOKEN=$IG_ACCESS_TOKEN
          EOF

      - name: Route this run (cron → niche/kind/mode/seed/long_form)
        id: route
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "niche=${{ inputs.niche }}"           >> $GITHUB_OUTPUT
            echo "kind=${{ inputs.kind }}"             >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode }}"             >> $GITHUB_OUTPUT
            echo "seed=${{ inputs.seed_offset }}"      >> $GITHUB_OUTPUT
            echo "long_form=${{ inputs.long_form }}"   >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 0 * * *" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=1"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "45 0 * * *" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=2"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=shloka"   >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 2 * * 0" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=true" >> $GITHUB_OUTPUT
          else
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline (telegram mode)
        if: steps.route.outputs.mode == 'telegram'
        run: |
          python run.py \
            --niche ${{ steps.route.outputs.niche }} \
            --kind ${{ steps.route.outputs.kind }} \
            --no-music \
            --notify-telegram \
            --seed-offset ${{ steps.route.outputs.seed }}

      - name: Run pipeline (publish mode)
        if: steps.route.outputs.mode == 'publish' && steps.route.outputs.long_form != 'true'
        run: |
          python run.py \
            --niche ${{ steps.route.outputs.niche }} \
            --kind ${{ steps.route.outputs.kind }} \
            --publish \
            --seed-offset ${{ steps.route.outputs.seed }}

      - name: Run pipeline (LONG-FORM publish mode, 20-25 min)
        if: steps.route.outputs.mode == 'publish' && steps.route.outputs.long_form == 'true'
        timeout-minutes: 90
        run: |
          python run.py \
            --niche ${{ steps.route.outputs.niche }} \
            --kind ${{ steps.route.outputs.kind }} \
            --publish \
            --long-form \
            --seed-offset ${{ steps.route.outputs.seed }}

      - name: Find generated long-form video
        if: steps.route.outputs.long_form == 'true'
        id: longform_video
        run: |
          VIDEO=$(ls -t output/videos/*.mp4 | head -1)
          echo "path=$VIDEO" >> $GITHUB_OUTPUT
          echo "name=$(basename $VIDEO)" >> $GITHUB_OUTPUT
          echo "Long-form video: $VIDEO ($(du -h "$VIDEO" | cut -f1))"

      - name: Upload long-form mp4 to GitHub Release (downloadable backup)
        if: steps.route.outputs.long_form == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: longform-${{ github.run_id }}
          name: "Long-form: ${{ steps.longform_video.outputs.name }}"
          files: ${{ steps.longform_video.outputs.path }}
          prerelease: false
          make_latest: false

      - name: Commit updated state files (shloka progress etc.)
        if: steps.route.outputs.niche == 'bhakti' && steps.route.outputs.kind == 'shloka'
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add data/state/*.json || true
          git diff --cached --quiet || git commit -m "auto: advance shloka progress [skip ci]"
          git push || true
