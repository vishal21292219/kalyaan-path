# Move to .github/workflows/daily-reels.yml in your GitHub repo.
#
# Daily auto-pipeline (4 runs/day):
#   06:00 IST → Itihaasvani video 1  (Telegram drop, manual upload)
#   06:15 IST → Itihaasvani video 2  (Telegram drop, different topic)
#   07:00 IST → KalyaanPath shloka   (auto-publish to YouTube)
#   19:00 IST → KalyaanPath trending (auto-publish to YouTube)
#
# Free Actions tier (private repo): 2000 min/mo. ~15 min × 4 × 30 = 1800 min.
# If you make the repo public, Actions are unlimited free.
name: Daily Reels (Itihaasvani + KalyaanPath)

on:
  # NOTE: each cron triggers GENERATION; video lands on YT ~25 min later.
  # Crons are scheduled 30 min BEFORE the intended publish time so videos
  # hit the algorithm window precisely.
  #
  # ITIHAASVANI (Telegram drop, manual upload): videos delivered to TG the
  # NIGHT BEFORE so user can schedule via YouTube Studio for next-day slots.
  # User receives 3 videos in TG at 21:00, 21:15, 21:30 IST — schedules them
  # for next day at 06:00 / 13:00 / 22:30 IST respectively (5 min/night).
  #
  schedule:
    - cron: "30 15 * * *"   # fire 21:00 IST → Itihaasvani drop #1 for TOMORROW 06:00 IST upload
    - cron: "45 15 * * *"   # fire 21:15 IST → Itihaasvani drop #2 for TOMORROW 13:00 IST upload
    - cron: "0 16 * * *"    # fire 21:30 IST → Itihaasvani drop #3 for TOMORROW 22:30 IST upload
    - cron: "0 1 * * *"     # fire 06:30 IST → bhakti shloka lands ~07:00 IST (KalyaanPath auto-publish)
    - cron: "0 13 * * *"    # fire 18:30 IST → bhakti trending lands ~19:00 IST (KalyaanPath auto-publish)
    - cron: "30 17 * * *"   # fire 23:00 IST = 17:30 UTC → TimeDecoders #1 lands ~18:00 UTC = UK 7PM / EU 8PM prime
    - cron: "30 22 * * *"   # fire 04:00 IST = 22:30 UTC → TimeDecoders #2 lands ~23:00 UTC = US 7PM EST prime
    - cron: "0 11 * * 6"    # fire 16:30 IST Sat = 11:00 UTC Sat → ITIHAASVANI LONG-FORM TG drop ~18:00 IST Sat → user schedules YT for Sat 22:00 IST (Hindi long-form prime time)
    - cron: "30 16 * * 6"   # fire 22:00 IST Sat = 16:30 UTC Sat → TimeDecoders LONG-FORM lands ~18:00 UTC Sat = US 1PM Sat / UK 6PM Sat (weekend prime, highest-RPM English niche)
  workflow_dispatch:
    inputs:
      niche:
        description: "Which niche to run manually"
        required: true
        default: "itihaas"
        type: choice
        options: [bhakti, itihaas, ancient]
      kind:
        description: "Which kind"
        required: true
        default: "trending"
        type: choice
        options: [shloka, trending]
      mode:
        description: "publish (auto-YT) or telegram (manual)"
        required: true
        default: "telegram"
        type: choice
        options: [publish, telegram]
      long_form:
        description: "Generate long-form 20-25 min video (Sunday weekly mode)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      topic:
        description: "Force specific topic (overrides trending pick). Leave empty for auto."
        required: false
        default: ""
      seed_offset:
        description: "Topic variation offset"
        required: false
        default: "0"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # bumped from 45 — Gemini fallback (HF depleted) takes 40-50 min to give buffer for slow Gemini fallback
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + Devanagari fonts (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk fonts-lohit-deva fontconfig
          fc-cache -f

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model (skipped if silence-align works)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-medium-v1

      - name: Restore OAuth + Telegram secrets to .env
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_ANCIENT_TOKEN_JSON: ${{ secrets.YT_ANCIENT_TOKEN_JSON }}
          YT_ANCIENT_CLIENT_SECRET_JSON: ${{ secrets.YT_ANCIENT_CLIENT_SECRET_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          mkdir -p secrets
          [ -n "$YT_TOKEN_JSON" ] && echo "$YT_TOKEN_JSON" > secrets/youtube_token.json
          [ -n "$YT_CLIENT_SECRET_JSON" ] && echo "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          [ -n "$YT_ANCIENT_TOKEN_JSON" ] && echo "$YT_ANCIENT_TOKEN_JSON" > secrets/ancient_youtube_token.json
          [ -n "$YT_ANCIENT_CLIENT_SECRET_JSON" ] && echo "$YT_ANCIENT_CLIENT_SECRET_JSON" > secrets/ancient_youtube_client_secret.json
          cat > .env <<EOF
          GEMINI_API_KEY=$GEMINI_API_KEY
          HUGGINGFACE_TOKEN=$HUGGINGFACE_TOKEN
          GROQ_API_KEY=$GROQ_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          IG_USER_ID=$IG_USER_ID
          IG_ACCESS_TOKEN=$IG_ACCESS_TOKEN
          EOF

      - name: Route this run (cron → niche/kind/mode/seed/long_form)
        id: route
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "niche=${{ inputs.niche }}"           >> $GITHUB_OUTPUT
            echo "kind=${{ inputs.kind }}"             >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode }}"             >> $GITHUB_OUTPUT
            echo "seed=${{ inputs.seed_offset }}"      >> $GITHUB_OUTPUT
            echo "long_form=${{ inputs.long_form }}"   >> $GITHUB_OUTPUT
            echo "topic=${{ inputs.topic }}"           >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=1"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "45 15 * * *" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=2"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=3"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=shloka"   >> $GITHUB_OUTPUT
            echo "mode=telegram"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram"  >> $GITHUB_OUTPUT
            echo "seed=1"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram"  >> $GITHUB_OUTPUT
            echo "seed=2"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 11 * * 6" ]; then
            # Itihaasvani long-form: TG drop (user has no OAuth for this channel).
            # Sat afternoon delivery → user schedules YT for Sat 22:00 IST Hindi prime
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 16 * * 6" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=true" >> $GITHUB_OUTPUT
          else
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline (telegram mode)
        if: steps.route.outputs.mode == 'telegram'
        run: |
          python -u run.py \
            --niche ${{ steps.route.outputs.niche }} \
            --kind ${{ steps.route.outputs.kind }} \
            --no-music \
            --notify-telegram \
            --seed-offset ${{ steps.route.outputs.seed }}

      - name: Run pipeline (publish mode)
        if: steps.route.outputs.mode == 'publish' && steps.route.outputs.long_form != 'true'
        run: |
          python -u run.py \
            --niche ${{ steps.route.outputs.niche }} \
            --kind ${{ steps.route.outputs.kind }} \
            --publish \
            --seed-offset ${{ steps.route.outputs.seed }}

      - name: Run pipeline (LONG-FORM publish mode, 20-25 min)
        if: steps.route.outputs.mode == 'publish' && steps.route.outputs.long_form == 'true'
        timeout-minutes: 90
        run: |
          TOPIC="${{ steps.route.outputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --topic "$TOPIC" \
              --publish \
              --long-form \
              --seed-offset ${{ steps.route.outputs.seed }}
          else
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --publish \
              --long-form \
              --seed-offset ${{ steps.route.outputs.seed }}
          fi

      - name: Find generated long-form video
        if: steps.route.outputs.long_form == 'true'
        id: longform_video
        run: |
          VIDEO=$(ls -t output/videos/*.mp4 | head -1)
          echo "path=$VIDEO" >> $GITHUB_OUTPUT
          echo "name=$(basename $VIDEO)" >> $GITHUB_OUTPUT
          echo "Long-form video: $VIDEO ($(du -h "$VIDEO" | cut -f1))"

      - name: Upload long-form mp4 to GitHub Release (downloadable backup)
        if: steps.route.outputs.long_form == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="longform-${{ github.run_id }}"
          NAME="Long-form: ${{ steps.longform_video.outputs.name }}"
          gh release create "$TAG" "${{ steps.longform_video.outputs.path }}" --title "$NAME" --notes "Auto long-form upload from run ${{ github.run_id }}" || true

      - name: Commit updated state files (shloka progress etc.)
        if: steps.route.outputs.niche == 'bhakti' && steps.route.outputs.kind == 'shloka'
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add data/state/*.json || true
          git diff --cached --quiet || git commit -m "auto: advance shloka progress [skip ci]"
          git push || true
