# Move to .github/workflows/daily-reels.yml in your GitHub repo.
#
# Daily auto-pipeline (4 runs/day):
#   06:00 IST → Itihaasvani video 1  (Telegram drop, manual upload)
#   06:15 IST → Itihaasvani video 2  (Telegram drop, different topic)
#   07:00 IST → KalyaanPath shloka   (auto-publish to YouTube)
#   19:00 IST → KalyaanPath trending (auto-publish to YouTube)
#
# Free Actions tier (private repo): 2000 min/mo. ~15 min × 4 × 30 = 1800 min.
# If you make the repo public, Actions are unlimited free.
name: Daily Reels (Itihaasvani + KalyaanPath)

on:
  # NOTE: each cron triggers GENERATION; video lands on YT ~25 min later.
  # Crons are scheduled 30 min BEFORE the intended publish time so videos
  # hit the algorithm window precisely.
  #
  # ITIHAASVANI (Telegram drop, manual upload): videos delivered to TG the
  # NIGHT BEFORE so user can schedule via YouTube Studio for next-day slots.
  # User receives 3 videos in TG at 21:00, 21:15, 21:30 IST — schedules them
  # for next day at 06:00 / 13:00 / 22:30 IST respectively (5 min/night).
  #
  schedule:
    # Itihaasvani: 2/day (cut from 3 — quality > quantity per review data).
    # Morning history/temple drop + night-prime SERIES binge drop.
    # - cron: "30 15 * * *"   # Itihaasvani AM trending — DISABLED 2026-06-05 per user (only PM series now)
    - cron: "0 16 * * *"    # fire 21:30 IST → Itihaasvani drop #2 (SERIES) for TOMORROW 22:30 IST upload
    # KalyaanPath: DAILY morning mantra. GENERATE early (21:30 UTC); YouTube
    # schedules go-live at 01:30 UTC (~7 AM IST) via publishAt — exact, on time.
    - cron: "30 21 * * *"      # generate ~21:30 UTC → scheduled go-live 01:30 UTC
    # KalyaanPath SUNDAY BHAJAN — its top-performing format (Vrindavan Bhajan =
    # 843 views, channel best). Music-heavy MP3 → video, auto-pick next unused
    # bhajan from data/music_bhajan/. Sunday evening prime.
    - cron: "0 10 * * 0"        # Sun: generate ~10:00 UTC → scheduled go-live 13:30 UTC (~7 PM IST)
    # REVIVED 2026-05-31: B-roll pivot (real Pexels stock footage, not AI slideshow).
    # TimeDecoders now auto-publishes to YouTube (OAuth wired).
    - cron: "0 14 * * *"    # generate ~14:00 UTC → scheduled go-live 18:00 UTC (2 PM ET, US afternoon)
    - cron: "0 20 * * *"    # generate ~20:00 UTC → scheduled go-live 00:00 UTC (8 PM ET, US evening PRIME)
    # GodsOfTheMind (English god-psychology): 2/day, generate-ahead + publishAt
    # so each video LANDS at the exact reach window.
    - cron: "30 11 * * *"   # gen 11:30 UTC → go-live 13:00 UTC (9 AM ET + 6:30 PM IST: US morning + India evening)
    - cron: "0 21 * * *"    # gen 21:00 UTC → go-live 23:00 UTC (7 PM ET: US evening prime)
    - cron: "0 11 * * 6"    # fire 16:30 IST Sat = 11:00 UTC Sat → ITIHAASVANI LONG-FORM TG drop ~18:00 IST Sat → user schedules YT for Sat 22:00 IST (Hindi long-form prime time)
    # - cron: "30 16 * * 6"   # TimeDecoders Saturday long-form — PARKED until pivot strategy ready
    # ONE-OFF: Neem Karoli Baba Jayanti (15 June) — special KalyaanPath devotional drop.
    - cron: "0 1 15 6 *"    # 01:00 UTC 15-Jun → generate → publish ~6:50 AM IST on his birthday
  workflow_dispatch:
    inputs:
      niche:
        description: "Which niche to run manually"
        required: true
        default: "itihaas"
        type: choice
        options: [bhakti, itihaas, ancient, bhajan, godmind]
      kind:
        description: "Which kind"
        required: true
        default: "trending"
        type: choice
        options: [trending, mantra, shloka, series]
      mode:
        description: "publish (auto-YT) or telegram (manual)"
        required: true
        default: "telegram"
        type: choice
        options: [publish, telegram]
      long_form:
        description: "Generate long-form 20-25 min video (Sunday weekly mode)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      topic:
        description: "Force specific topic (overrides trending pick). Leave empty for auto."
        required: false
        default: ""
      real_photos:
        description: "Commons search term for a real-person subject (e.g. 'Neem Karoli Baba') → uses real Wikimedia photos instead of AI. Leave empty for AI."
        required: false
        default: ""
      seed_offset:
        description: "Topic variation offset"
        required: false
        default: "0"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # bumped from 45 — Gemini fallback (HF depleted) takes 40-50 min to give buffer for slow Gemini fallback
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + Devanagari fonts (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk fonts-lohit-deva fontconfig
          fc-cache -f

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model (skipped if silence-align works)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-medium-v1

      - name: Restore OAuth + Telegram secrets to .env
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_ANCIENT_TOKEN_JSON: ${{ secrets.YT_ANCIENT_TOKEN_JSON }}
          YT_ANCIENT_CLIENT_SECRET_JSON: ${{ secrets.YT_ANCIENT_CLIENT_SECRET_JSON }}
          YT_ITIHAAS_TOKEN_JSON: ${{ secrets.YT_ITIHAAS_TOKEN_JSON }}
          YT_ITIHAAS_CLIENT_SECRET_JSON: ${{ secrets.YT_ITIHAAS_CLIENT_SECRET_JSON }}
          YT_GODMIND_TOKEN_JSON: ${{ secrets.YT_GODMIND_TOKEN_JSON }}
          YT_GODMIND_CLIENT_SECRET_JSON: ${{ secrets.YT_GODMIND_CLIENT_SECRET_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_ANCIENT: ${{ secrets.FB_PAGE_ID_ANCIENT }}
          FB_PAGE_TOKEN_ANCIENT: ${{ secrets.FB_PAGE_TOKEN_ANCIENT }}
          FB_PAGE_ID_BHAKTI: ${{ secrets.FB_PAGE_ID_BHAKTI }}
          FB_PAGE_TOKEN_BHAKTI: ${{ secrets.FB_PAGE_TOKEN_BHAKTI }}
          FB_PAGE_ID_ITIHAAS: ${{ secrets.FB_PAGE_ID_ITIHAAS }}
          FB_PAGE_TOKEN_ITIHAAS: ${{ secrets.FB_PAGE_TOKEN_ITIHAAS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p secrets
          [ -n "$YT_TOKEN_JSON" ] && echo "$YT_TOKEN_JSON" > secrets/youtube_token.json
          [ -n "$YT_CLIENT_SECRET_JSON" ] && echo "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          [ -n "$YT_ANCIENT_TOKEN_JSON" ] && echo "$YT_ANCIENT_TOKEN_JSON" > secrets/ancient_youtube_token.json
          [ -n "$YT_ANCIENT_CLIENT_SECRET_JSON" ] && echo "$YT_ANCIENT_CLIENT_SECRET_JSON" > secrets/ancient_youtube_client_secret.json
          [ -n "$YT_ITIHAAS_TOKEN_JSON" ] && echo "$YT_ITIHAAS_TOKEN_JSON" > secrets/itihaas_youtube_token.json
          [ -n "$YT_ITIHAAS_CLIENT_SECRET_JSON" ] && echo "$YT_ITIHAAS_CLIENT_SECRET_JSON" > secrets/itihaas_youtube_client_secret.json
          [ -n "$YT_GODMIND_TOKEN_JSON" ] && echo "$YT_GODMIND_TOKEN_JSON" > secrets/godmind_youtube_token.json
          [ -n "$YT_GODMIND_CLIENT_SECRET_JSON" ] && echo "$YT_GODMIND_CLIENT_SECRET_JSON" > secrets/godmind_youtube_client_secret.json
          cat > .env <<EOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          FAL_KEY=$FAL_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          HUGGINGFACE_TOKEN=$HUGGINGFACE_TOKEN
          GROQ_API_KEY=$GROQ_API_KEY
          ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          FB_PAGE_ID=$FB_PAGE_ID
          FB_PAGE_TOKEN=$FB_PAGE_TOKEN
          FB_PAGE_ID_ANCIENT=$FB_PAGE_ID_ANCIENT
          FB_PAGE_TOKEN_ANCIENT=$FB_PAGE_TOKEN_ANCIENT
          FB_PAGE_ID_BHAKTI=$FB_PAGE_ID_BHAKTI
          FB_PAGE_TOKEN_BHAKTI=$FB_PAGE_TOKEN_BHAKTI
          FB_PAGE_ID_ITIHAAS=$FB_PAGE_ID_ITIHAAS
          FB_PAGE_TOKEN_ITIHAAS=$FB_PAGE_TOKEN_ITIHAAS
          IG_USER_ID=$IG_USER_ID
          IG_ACCESS_TOKEN=$IG_ACCESS_TOKEN
          PEXELS_API_KEY=$PEXELS_API_KEY
          EOF

      - name: Route this run (cron → niche/kind/mode/seed/long_form)
        id: route
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "niche=${{ inputs.niche }}"           >> $GITHUB_OUTPUT
            echo "kind=${{ inputs.kind }}"             >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode }}"             >> $GITHUB_OUTPUT
            echo "seed=${{ inputs.seed_offset }}"      >> $GITHUB_OUTPUT
            echo "long_form=${{ inputs.long_form }}"   >> $GITHUB_OUTPUT
            echo "topic=${{ inputs.topic }}"           >> $GITHUB_OUTPUT
            echo "real_photos=${{ inputs.real_photos }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            # AM drop = trending (monuments/forts/tech — NON-temple). AUTO-publish
            # to YouTube; go-live ~08:30 IST next day via publishAt.
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=1"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "45 15 * * *" ]; then
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=2"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            # Night prime drop = standalone VIRAL RAHASYA topic (data-driven 2026-06-08:
            # Mahabharat Villains series flopped 51→19→2→0; standalone mythology
            # "rahasya/chamatkar" topics like Kamadhenu/Tripurasur won 246-482 views).
            # kind=trending → pick_viral (mythology FIGURE topics weighted 3x).
            # AUTO-publish; go-live ~20:00 IST next day via publishAt (14:30 UTC).
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=3"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            # KalyaanPath morning mantra, DAILY, AUTO-publish to YouTube.
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=mantra"   >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 10 * * 0" ]; then
            # KalyaanPath SUNDAY BHAJAN — music-MP3 → video, AUTO-publish to YouTube.
            echo "niche=bhajan"  >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=1"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=2"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 11 * * *" ]; then
            # GodsOfTheMind drop #1 → go-live 13:00 UTC (US morning + India evening).
            echo "niche=godmind"  >> $GITHUB_OUTPUT
            echo "kind=trending"  >> $GITHUB_OUTPUT
            echo "mode=publish"   >> $GITHUB_OUTPUT
            echo "seed=1"         >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            # GodsOfTheMind drop #2 → go-live 23:00 UTC (US evening prime).
            echo "niche=godmind"  >> $GITHUB_OUTPUT
            echo "kind=trending"  >> $GITHUB_OUTPUT
            echo "mode=publish"   >> $GITHUB_OUTPUT
            echo "seed=2"         >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 11 * * 6" ]; then
            # Itihaasvani long-form: TG drop (user has no OAuth for this channel).
            # Sat afternoon delivery → user schedules YT for Sat 22:00 IST Hindi prime
            echo "niche=itihaas" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram" >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 16 * * 6" ]; then
            echo "niche=ancient" >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=telegram"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 1 15 6 *" ]; then
            # Neem Karoli Baba Jayanti (15 June) — special KalyaanPath devotional
            # drop, forced topic, AUTO-publish immediately on his birthday morning.
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=5"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
            echo "topic=Neem Karoli Baba (Kainchi Dham wale Maharaj ji) — unke chamatkar, rahasya aur asli parichay, unke janmotsav (15 June) ke avsar par" >> $GITHUB_OUTPUT
            echo "real_photos=Neem Karoli Baba" >> $GITHUB_OUTPUT
          else
            echo "niche=bhakti"  >> $GITHUB_OUTPUT
            echo "kind=trending" >> $GITHUB_OUTPUT
            echo "mode=publish"  >> $GITHUB_OUTPUT
            echo "seed=0"        >> $GITHUB_OUTPUT
            echo "long_form=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline (telegram mode)
        if: steps.route.outputs.mode == 'telegram'
        env:
          FORCE_REAL_PHOTOS: ${{ steps.route.outputs.real_photos }}
        run: |
          TOPIC="${{ steps.route.outputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --topic "$TOPIC" \
              --auto-thumb \
              --notify-telegram \
              --seed-offset ${{ steps.route.outputs.seed }}
          else
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --auto-thumb \
              --notify-telegram \
              --seed-offset ${{ steps.route.outputs.seed }}
          fi

      - name: Run pipeline (publish mode)
        if: steps.route.outputs.mode == 'publish' && steps.route.outputs.long_form != 'true'
        env:
          FORCE_REAL_PHOTOS: ${{ steps.route.outputs.real_photos }}
        run: |
          NOTIFY="${{ steps.route.outputs.niche == 'godmind' && '--notify-telegram' || '' }}"
          TOPIC="${{ steps.route.outputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --topic "$TOPIC" \
              --publish --auto-thumb $NOTIFY \
              --seed-offset ${{ steps.route.outputs.seed }}
          else
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --publish --auto-thumb $NOTIFY \
              --seed-offset ${{ steps.route.outputs.seed }}
          fi

      - name: Run pipeline (LONG-FORM publish mode, 20-25 min)
        if: steps.route.outputs.mode == 'publish' && steps.route.outputs.long_form == 'true'
        timeout-minutes: 90
        run: |
          TOPIC="${{ steps.route.outputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --topic "$TOPIC" \
              --publish \
              --long-form \
              --seed-offset ${{ steps.route.outputs.seed }}
          else
            python -u run.py \
              --niche ${{ steps.route.outputs.niche }} \
              --kind ${{ steps.route.outputs.kind }} \
              --publish \
              --long-form \
              --seed-offset ${{ steps.route.outputs.seed }}
          fi

      - name: Find generated long-form video
        if: steps.route.outputs.long_form == 'true'
        id: longform_video
        run: |
          VIDEO=$(ls -t output/videos/*.mp4 | head -1)
          echo "path=$VIDEO" >> $GITHUB_OUTPUT
          echo "name=$(basename $VIDEO)" >> $GITHUB_OUTPUT
          echo "Long-form video: $VIDEO ($(du -h "$VIDEO" | cut -f1))"

      - name: Upload long-form mp4 to GitHub Release (downloadable backup)
        if: steps.route.outputs.long_form == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="longform-${{ github.run_id }}"
          NAME="Long-form: ${{ steps.longform_video.outputs.name }}"
          gh release create "$TAG" "${{ steps.longform_video.outputs.path }}" --title "$NAME" --notes "Auto long-form upload from run ${{ github.run_id }}" || true

      - name: Commit updated state (delivery markers, histories, progress)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add data/state/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: state update [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || true
          fi
