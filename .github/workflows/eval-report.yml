name: Eval Report (weekly → Discord)

# Weekly performance review of all YT channels (+ FB if APIFY_TOKEN): subs/views
# trends, uploads, schedule correctness, duplicate detection, Claude action items.
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC = 9:00 AM IST
  workflow_dispatch:

concurrency:
  group: eval-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests python-dotenv
      - name: Build + send eval report
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_ANCIENT_TOKEN_JSON: ${{ secrets.YT_ANCIENT_TOKEN_JSON }}
          YT_ANCIENT_CLIENT_SECRET_JSON: ${{ secrets.YT_ANCIENT_CLIENT_SECRET_JSON }}
          YT_ITIHAAS_TOKEN_JSON: ${{ secrets.YT_ITIHAAS_TOKEN_JSON }}
          YT_ITIHAAS_CLIENT_SECRET_JSON: ${{ secrets.YT_ITIHAAS_CLIENT_SECRET_JSON }}
          YT_GODMIND_TOKEN_JSON: ${{ secrets.YT_GODMIND_TOKEN_JSON }}
          YT_GODMIND_CLIENT_SECRET_JSON: ${{ secrets.YT_GODMIND_CLIENT_SECRET_JSON }}
          YT_MONEURONS_TOKEN_JSON: ${{ secrets.YT_MONEURONS_TOKEN_JSON }}
          YT_MONEURONS_CLIENT_SECRET_JSON: ${{ secrets.YT_MONEURONS_CLIENT_SECRET_JSON }}
          YT_LAKEEREIN_TOKEN_JSON: ${{ secrets.YT_LAKEEREIN_TOKEN_JSON }}
          YT_LAKEEREIN_CLIENT_SECRET_JSON: ${{ secrets.YT_LAKEEREIN_CLIENT_SECRET_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python eval_report.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/eval_snapshot.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: eval snapshot [skip ci]" || true
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              echo "push retry $i…"; sleep 5
            done
          fi
