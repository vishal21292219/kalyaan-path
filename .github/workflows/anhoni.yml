# ANHONI — daily premium suspense comic-story Short.
# Picks the day's suspense seed (date-rotation), generates a character-locked
# comic video (Claude story + fal nano-banana art + stable-audio music), and
# publishes to YouTube + Instagram + Facebook.
# Scheduled for NIGHT IST (~9:30 PM) — prime time for suspense/thriller content.
# Reuses the SAME GitHub Secrets as Lakeerein (same channel, renamed) — no new secrets.
name: Anhoni Daily

on:
  schedule:
    - cron: "45 15 * * *"   # 21:15 IST start → posts ~9:30 PM IST (prime suspense window)
  workflow_dispatch:         # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Build only, do not publish"
        type: boolean
        default: false

jobs:
  anhoni:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto fontconfig
          fc-cache -f

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth (same channel as Lakeerein)
        env:
          YT_LAKEEREIN_TOKEN_JSON: ${{ secrets.YT_LAKEEREIN_TOKEN_JSON }}
          YT_LAKEEREIN_CLIENT_SECRET_JSON: ${{ secrets.YT_LAKEEREIN_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p lakeerein
          printf '%s' "$YT_LAKEEREIN_TOKEN_JSON" > lakeerein/yt_token_lakeerein.json
          printf '%s' "$YT_LAKEEREIN_CLIENT_SECRET_JSON" > lakeerein/yt_client_secret.json

      - name: Generate + publish (YT + IG + FB)
        working-directory: anhoni
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LAKEEREIN_IG_WEBHOOK: ${{ secrets.LAKEEREIN_IG_WEBHOOK }}
        run: |
          python daily_anhoni.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit published log
        if: github.event_name == 'schedule'
        run: |
          git config user.name "anhoni-bot"
          git config user.email "bot@anhoni.local"
          git add anhoni/published_log.json || true
          git commit -m "anhoni: published $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped"
