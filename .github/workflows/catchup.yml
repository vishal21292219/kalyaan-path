# Catch-up safety net — recovers daily slots that GitHub's unreliable scheduled
# crons dropped/delayed. Runs run_catchup.py, which re-runs any of today's slots
# not yet marked delivered in data/state/published_log.json.
#
# Recovers any slot whose primary generation cron lagged/skipped. Each run sits a
# few hours AFTER its target gen (so it never races a merely-lagged primary) and
# ~1.5h BEFORE that slot's go-live peak, so a recovered GoM reel still hits its
# OWN peak (SOP G3 — "no missed slots"). Day-boundary safe (last_published
# timestamps), so the 23:30 run correctly recovers the 19:00→01:00 GoM slot.
#   15:30 → GoM#1 (gen 12:00, peak 17:00)
#   19:30 → GoM#2 (gen 15:00, peak 21:00) + mantra(15:32) + ancient(15:37/16:42) + itihaas(16:00)
#   23:30 → GoM#3 (gen 19:00, peak 01:00 next day)
#   12:00 Sun → bhajan (gen 10:00, peak 13:30) — recover before its Sunday go-live
name: Catch-up (recover missed posts)

on:
  schedule:
    - cron: "30 15 * * *"  # GoM#1 — before its 17:00 peak
    - cron: "30 19 * * *"  # GoM#2 + mantra/ancient/itihaas cluster — before 21:00 peak
    - cron: "30 23 * * *"  # GoM#3 — before its 01:00 (next-day) peak
    - cron: "0 12 * * 0"   # Sunday bhajan — before its 13:30 go-live
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be recovered"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk fonts-lohit-deva fontconfig
          fc-cache -f

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Restore OAuth + secrets to .env
        # Mirrors daily-reels.yml EXACTLY so a recovered slot publishes to every
        # channel the primary run would have (all YT channels + FB/IG via Make +
        # Cloudinary). Previously catch-up only had YT_TOKEN + ancient → a
        # recovered GoM/ancient slot silently dropped its FB/IG reel.
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_ANCIENT_TOKEN_JSON: ${{ secrets.YT_ANCIENT_TOKEN_JSON }}
          YT_ANCIENT_CLIENT_SECRET_JSON: ${{ secrets.YT_ANCIENT_CLIENT_SECRET_JSON }}
          YT_ITIHAAS_TOKEN_JSON: ${{ secrets.YT_ITIHAAS_TOKEN_JSON }}
          YT_ITIHAAS_CLIENT_SECRET_JSON: ${{ secrets.YT_ITIHAAS_CLIENT_SECRET_JSON }}
          YT_GODMIND_TOKEN_JSON: ${{ secrets.YT_GODMIND_TOKEN_JSON }}
          YT_GODMIND_CLIENT_SECRET_JSON: ${{ secrets.YT_GODMIND_CLIENT_SECRET_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_ANCIENT: ${{ secrets.FB_PAGE_ID_ANCIENT }}
          FB_PAGE_TOKEN_ANCIENT: ${{ secrets.FB_PAGE_TOKEN_ANCIENT }}
          FB_PAGE_ID_BHAKTI: ${{ secrets.FB_PAGE_ID_BHAKTI }}
          FB_PAGE_TOKEN_BHAKTI: ${{ secrets.FB_PAGE_TOKEN_BHAKTI }}
          FB_PAGE_ID_ITIHAAS: ${{ secrets.FB_PAGE_ID_ITIHAAS }}
          FB_PAGE_TOKEN_ITIHAAS: ${{ secrets.FB_PAGE_TOKEN_ITIHAAS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MAKE_REEL_WEBHOOK: ${{ secrets.MAKE_REEL_WEBHOOK }}
        run: |
          mkdir -p secrets
          [ -n "$YT_TOKEN_JSON" ] && echo "$YT_TOKEN_JSON" > secrets/youtube_token.json
          [ -n "$YT_CLIENT_SECRET_JSON" ] && echo "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          [ -n "$YT_ANCIENT_TOKEN_JSON" ] && echo "$YT_ANCIENT_TOKEN_JSON" > secrets/ancient_youtube_token.json
          [ -n "$YT_ANCIENT_CLIENT_SECRET_JSON" ] && echo "$YT_ANCIENT_CLIENT_SECRET_JSON" > secrets/ancient_youtube_client_secret.json
          [ -n "$YT_ITIHAAS_TOKEN_JSON" ] && echo "$YT_ITIHAAS_TOKEN_JSON" > secrets/itihaas_youtube_token.json
          [ -n "$YT_ITIHAAS_CLIENT_SECRET_JSON" ] && echo "$YT_ITIHAAS_CLIENT_SECRET_JSON" > secrets/itihaas_youtube_client_secret.json
          [ -n "$YT_GODMIND_TOKEN_JSON" ] && echo "$YT_GODMIND_TOKEN_JSON" > secrets/godmind_youtube_token.json
          [ -n "$YT_GODMIND_CLIENT_SECRET_JSON" ] && echo "$YT_GODMIND_CLIENT_SECRET_JSON" > secrets/godmind_youtube_client_secret.json
          cat > .env <<EOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          FAL_KEY=$FAL_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          HUGGINGFACE_TOKEN=$HUGGINGFACE_TOKEN
          GROQ_API_KEY=$GROQ_API_KEY
          ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          FB_PAGE_ID=$FB_PAGE_ID
          FB_PAGE_TOKEN=$FB_PAGE_TOKEN
          FB_PAGE_ID_ANCIENT=$FB_PAGE_ID_ANCIENT
          FB_PAGE_TOKEN_ANCIENT=$FB_PAGE_TOKEN_ANCIENT
          FB_PAGE_ID_BHAKTI=$FB_PAGE_ID_BHAKTI
          FB_PAGE_TOKEN_BHAKTI=$FB_PAGE_TOKEN_BHAKTI
          FB_PAGE_ID_ITIHAAS=$FB_PAGE_ID_ITIHAAS
          FB_PAGE_TOKEN_ITIHAAS=$FB_PAGE_TOKEN_ITIHAAS
          IG_USER_ID=$IG_USER_ID
          IG_ACCESS_TOKEN=$IG_ACCESS_TOKEN
          PEXELS_API_KEY=$PEXELS_API_KEY
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          MAKE_REEL_WEBHOOK=$MAKE_REEL_WEBHOOK
          EOF

      - name: Run catch-up sweep
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -u run_catchup.py --dry-run
          else
            python -u run_catchup.py
          fi

      - name: Commit state (delivery markers + history)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add data/state/*.json || true
          # CRITICAL: never commit the poster's dedup ledger (reverting it re-fires
          # already-posted reels). The reel-poster is the only writer of this file.
          git reset -q data/state/posted_reels_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "auto: catch-up state update [skip ci]" || true
            # Rebase+retry; abort conflicted rebase between tries (avoid the
            # "unmerged files" wedge) and stay NON-FATAL so a state-push miss
            # never fails the run (failed run → Retry-Failed → duplicate uploads).
            pushed=0
            for i in 1 2 3 4 5 6; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "state push attempt $i failed (concurrent run) — retrying in 5s…"
              sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "::warning::catch-up state push skipped after retries (non-fatal)"
            fi
          fi
