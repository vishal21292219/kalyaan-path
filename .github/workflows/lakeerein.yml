# Lakeerein — daily emotional-nostalgia stickman Short.
# Picks the day's topic (date-rotation), generates a premium video (Claude script
# + unique fal images + ElevenLabs Chem voice), and publishes to YT + IG + FB
# scheduled for 8:30 PM IST. Cloud (Mac-independent).
name: Lakeerein Daily

on:
  # HELD 2026-06-20 (per user — focus GoM + TD + MN). Re-enable the schedule
  # block below to resume Lakeerein daily auto-posting.
  # schedule:
  #   - cron: "30 4 * * *"   # 10:00 AM IST → Lakeerein daily — HELD
  workflow_dispatch:        # manual run button (still available)

jobs:
  lakeerein:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk fontconfig
          fc-cache -f

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Restore Lakeerein YouTube OAuth files from secrets
        env:
          YT_LAKEEREIN_TOKEN_JSON: ${{ secrets.YT_LAKEEREIN_TOKEN_JSON }}
          YT_LAKEEREIN_CLIENT_SECRET_JSON: ${{ secrets.YT_LAKEEREIN_CLIENT_SECRET_JSON }}
        run: |
          printf '%s' "$YT_LAKEEREIN_TOKEN_JSON" > lakeerein/yt_token_lakeerein.json
          printf '%s' "$YT_LAKEEREIN_CLIENT_SECRET_JSON" > lakeerein/yt_client_secret.json

      - name: Generate + publish (YT + IG + FB)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LAKEEREIN_IG_WEBHOOK: ${{ secrets.LAKEEREIN_IG_WEBHOOK }}
        run: |
          python lakeerein/daily_lakeerein.py
