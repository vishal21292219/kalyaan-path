    description_hook: "मर्यादा पुरुषोत्तम राम की शांत भक्ति 🙏"
  devi:
    title_hint: "Jai Mata Di 🔱"
    description_hook: "माँ दुर्गा की पावन भक्ति 🙏"
  ganesh:
