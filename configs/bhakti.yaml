niche: bhakti

branding:
  channel_handle: '@KalyaanPath'
  cta: "Kalyaan ka path \U0001F64F Subscribe for daily Gita + Bhakti reels"
  hashtags:
  - '#hinduism'
  - '#bhakti'
  - '#sanatandharma'
  - '#mantra'
  - '#shorts'
  - '#reels'
  - '#mahadev'
  - '#krishna'
  - '#ram'
  music_credit: "Music: synthesized cinematic drone — original, royalty-free"
  ai_disclosure: "🙏 KalyaanPath devotional content | Crafted with care using AI-assisted tools, every video curated by our team for authentic Hindu wisdom."

paths:
  topics_file: data/topics.json
  music_dir: data/music
  state_dir: data/state
  shloka_progress: data/state/shloka_progress.json

secrets:
  youtube_client_secret: secrets/youtube_client_secret.json
  youtube_token: secrets/youtube_token.json

images:
  provider: gemini
  model: gemini-3.1-flash-image-preview
  fallback_model: flux-realism
  negative: text, watermark, logo, captions, signature, ugly, deformed, mutated, malformed limbs, extra fingers, extra arms, extra heads, missing limbs, distorted face, asymmetric face, melted features, broken anatomy, twisted body, blurry, low quality, cartoon, anime, chibi, modern clothing, dark gloomy mood, underexposed, muddy colors, washed out
  num_per_reel: 10
  style_suffix: ', traditional Indian devotional painting in Raja Ravi Varma style fused with cinematic ultra realistic 3D rendering, single deity figure clearly visible and sharply in focus, anatomically correct (two arms, one head, five fingers per hand unless canonically more like Vishnu four arms or Durga eight arms), centered composition, BRIGHT divine warm golden volumetric light bathing the scene, well-illuminated peaceful face with clear devotional expression, rich saturated golden-saffron-warm color palette, intricate fabric and jewelry detail, polished masterpiece quality, vertical 9:16 portrait, ultra detailed 8K rendering, no text no watermark'

llm:
  language: hindi
  model: gemini-flash-latest
  provider: gemini
  persona: |
    You are a viral short-form scriptwriter for "KalyaanPath" (@KalyaanPath) —
    a Hindi-first YouTube Shorts channel about Hindu bhakti, Geeta wisdom,
    deity stories, and authentic spiritual content.

    CHANNEL NICHE:
    Geeta shlokas explained in modern context, deity stories (Hanuman / Krishna /
    Ram / Shiv / Devi / Ganesh / Khatu Shyam / Sai Baba), chamatkar series
    (miracle stories), Hanuman Chalisa chaupais deep-dive, vrat kathas,
    festival significance, daily vichaar (philosophical reflections).

    TONE:
    - Reverent + warm + emotional storytelling — never satirical or divisive
    - Pure Hindi in Devanagari for voiceover (Roman for captions)
    - Use power words: kripa, chamatkar, sach, sandesh, leela, ansoo, prem,
      anubhav, sankalp, vishwas, rahasya
    - Speak as a devotee sharing wisdom with another devotee — never as a teacher
      lecturing students
    - Frame every video as a personal anubhav (experience) the viewer can share

    AUDIENCE:
    Hindi-speaking Hindu devotees, 25-65 age, primarily India + diaspora.
    Heavy mobile users. Watch in morning (aarti time) and evening (sandhya time).
    Highly emotional buyers — they'll watch entire 60-sec video if first 3 sec
    promises a divine connection or chamatkar story.

    NEVER:
    - Mix political content or modern figures
    - Make doctrinal claims (Shaiva vs Vaishnav etc.)
    - Use English greetings (use "Hari Om" / "Jai Shri Krishna" instead)
    - Sound preachy or commanding — invite devotion, don't demand it
  content_spec: |
    OUTPUT RULES — apply to every KalyaanPath video, no exceptions.

    1. title (≤70 chars) — VERIFIED Kaliyug Ke Divya Mantra pattern (avg 7M views):
       - MUST START with devotional emoji: 🌸 🌺 🔥 🔱 (NOT end with emoji)
       - Use pipe "|" for two-part titles
       - Hindi power words: रहस्य, सच, मंत्र, कथा
       - End with 😱 for mystery hook
       - Optional English keyword tail for diaspora SEO
       - Verified viral examples (29M+ views):
         * "🌸 इंसान के शरीर का सबसे बड़ा रहस्य | 😱"
         * "🌺 राम सेतु का सच 😱"
         * "🔱 माँ काली की रहस्यमयी मंत्र ज्ञान कथा | सुनिए वो मंत्र जो जीवन बदल दे! 😱"
         * "🔥 क्यों बर्बरीक बने खाटू श्याम जी? जानिए वह रहस्य जो 99% लोग नहीं जानते | Krishna Barbarik Story 🌺"
       - Frame as MYSTERY ("rahasya/sach"), never as praise/devotional-only
       - BAD: "Hanuman ji ka mantra" (no mystery hook = no clicks)

    2. description (≤1800 chars, EXACT structure in this order):
       Line 1: Devotional hook ("Kya aap jaante hain ki...") + relevant emoji
       Line 2-3: 2-3 sentence teaser revealing just enough — leave the
                 spiritual revelation for the video
       Line 4: Engagement question — ask viewers for their bhakti anubhav
                 ("Aapka bhi yeh anubhav hua hai? Comment me likhein 🙏")
       Line 5 (verbatim): "KalyaanPath ke saath har din apna kalyaan paayein —
                          Subscribe karein abhi 🙏"
       Line 6 (verbatim, with exact emojis and line breaks):
              "🔔 Daily uploads on @KalyaanPath:
               ✨ 7 AM — Geeta Shloka
               ✨ 7 PM — Bhakti katha / chamatkar"
       Line 7 (verbatim): "📩 Business: gopulabs@gmail.com"
       Line 8: 12-15 hashtags (mix of niche-specific + viral)
              Always include: #KalyaanPath #Hinduism #Bhakti #SanatanDharma
              + 8-10 topic-specific tags
       Line 9 (VIRAL SEO BLOCK — proven 3M-view formula): the literal string
              "Your Queries:" followed by 18-25 long-tail search keyword
              variations of the topic, one per line, lowercase Hinglish.
              Mix questions ("hanuman ji ka mantra kaun sa hai"),
              statements ("krishna ji ki bhakti se kya milta hai"),
              and search-form variants. Targets YT long-tail indexing.

    3. body lines:
       - Each line = one breath, 6-12 words, simple Hindi (grade 8 vocabulary)
       - Every 2-3 lines deliver a mini-revelation or surprise
       - Use STATEMENT → COUNTER → REVELATION technique
       - NEVER preachy — devotional warmth always
       - Include personal anubhav frame: "Mahatma ji kehte hain ki...", "Ek
         bhakt ki sachi katha hai..."

    4. cta:
       - Always ask BINARY devotional question for max comments:
         "Aapki bhi yeh manokamna poori hui hai — haan ya nahi? Comment 🙏"
       - Always mention channel + chanting call:
         "KalyaanPath ko subscribe karein, aur comment me likhein:
          Jai Shri Krishna / Jai Bajrangi / Har Har Mahadev"

    5. visuals:
       - Single deity figure clearly visible, anatomically correct
       - Raja Ravi Varma painting style fused with cinematic 3D
       - Bright golden volumetric light, never gloomy
       - 9:16 vertical, no text/watermarks
       - Every scene must look DEVOTIONAL not corporate
  image_style_guidance: |
    - Always specify "single figure, full body, centered, anatomically correct, two arms" (unless the deity canonically has more, then specify exact count: "four arms holding lotus, conch, mace, chakra").
    - Art style: "traditional Indian devotional painting, Raja Ravi Varma style" or "cinematic concept art, soft volumetric light".
    - Lighting + mood: "golden hour sunrise", "soft divine glow".
    - NO text, watermarks, or words in image.
  topic_guidance: |
    Topics include Hindu deities, Gita shlokas, mythological stories, sacred temples, and Hindu festivals.
    Avoid political content, modern figures, or controversial claims.

publish:
  instagram: true
  privacy: public
  youtube: true

video:
  bitrate: 6M
  duration_target_sec: 50
  font: /System/Library/Fonts/Supplemental/Devanagari Sangam MN.ttc
  font_size: 72
  fps: 30
  height: 1920
  subtitle_box_opacity: 0.0
  width: 1080

voice:
  # provider: "edge" (free Microsoft voices) or "elevenlabs" (premium)
  provider: edge
  fallback_to_edge: true

  # Edge TTS (free) — Microsoft Hindi voices
  pitch: +25Hz
  rate: +3%
  shloka_pitch: -2Hz
  shloka_rate: -12%
  shloka_voice: hi-IN-MadhurNeural
  voice: hi-IN-SwaraNeural

  # Voice rotation pool (used only for non-shloka kinds — bhakti trending,
  # katha, etc.). Shloka keeps its dedicated male voice for series consistency.
  # When morning aarti slot goes live, seed=1 picks pool[1] = MadhurNeural etc.
  # Edge-TTS has only 2 valid Hindi voices (Madhur + Swara) — verified via API.
  # Cycle between them across slots; pitch/rate variation per cfg adds further
  # fingerprint diversity.
  voice_pool:
    - hi-IN-SwaraNeural   # female, peaceful (evening katha)
    - hi-IN-MadhurNeural  # male, devotional

  # ElevenLabs (premium) — pick voices at elevenlabs.io/app/voice-library
  # "Charlotte" (warm female) — good for devotional. Swap with Hindi-native if preferred.
  elevenlabs_voice_id: XB0fDUnXU5powFXDhCwa
  # "Adam" (deep male) — better for shloka narration
  elevenlabs_shloka_voice_id: pNInz6obpgDQGcFmaJgB
  elevenlabs_model: eleven_multilingual_v2
  elevenlabs_settings:
    stability: 0.55
    similarity_boost: 0.80
    style: 0.30
    use_speaker_boost: true
