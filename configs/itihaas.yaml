  rate: -2%
  shloka_pitch: -8Hz
  shloka_rate: -12%
  shloka_voice: hi-IN-MadhurNeural
  voice: hi-IN-MadhurNeural

  # ElevenLabs (premium) — Adam = deep dramatic male, perfect for storytelling
