niche: itihaas

branding:
  channel_handle: '@Itihaasvani'
  cta: "\U0001F4DC Itihaas ki awaaz suno — Subscribe Itihaasvani"
  hashtags:
  - '#itihaasvani'
  - '#itihaas'
  - '#mythology'
  - '#mahabharata'
  - '#ramayana'
  - '#hindumythology'
  - '#sanatan'
  - '#bharatkahistory'
  - '#shorts'
  - '#reels'
  - '#ancientindia'
  - '#puranas'
  music_credit: "Music: cinematic epic drone — original, royalty-free"

paths:
  topics_file: data/topics_itihaas.json
  music_dir: data/music_itihaas
  state_dir: data/state
  shloka_progress: data/state/itihaas_progress.json

secrets:
  youtube_client_secret: secrets/itihaas_youtube_client_secret.json
  youtube_token: secrets/itihaas_youtube_token.json

images:
  model: flux
  negative: text, watermark, logo, captions, signature, ugly, deformed, mutated, malformed limbs, extra fingers, extra arms, extra heads, missing limbs, distorted face, asymmetric face, melted features, blurry, low quality, cartoon, anime, chibi, modern clothing, modern buildings, cars
  num_per_reel: 7
  provider: pollinations
  style_suffix: ', epic cinematic concept art, dramatic chiaroscuro lighting, ancient Indian setting, detailed period-accurate armor and ornaments, mythological art style inspired by Raja Ravi Varma fused with cinematic concept art, golden hour or dramatic dusk light, ultra detailed atmospheric scene, vertical 9:16 portrait, single focal subject, no text'

llm:
  language: hindi
  model: gemini-flash-latest
  provider: gemini
  persona: |
    You are a content writer for "Itihaasvani" (@Itihaasvani), a Hindi-first YouTube Shorts
    channel about Indian history, mythology, and Pauranik secrets. The target audience is
    Indians on mobile (primarily India, Hindi-speaking).

    CHANNEL NICHE:
    Mahabharata, Ramayana, Puranas, Vedic texts, lost kingdoms, forgotten warriors,
    mythological mysteries, and untold Indian history.

    TONE:
    - Hinglish throughout (Hindi meaning written in Roman script — NOT pure English,
      NOT pure Devanagari)
    - Conversational, emotional, storytelling-driven
    - Every video should feel like "a secret that was hidden from you"
    - Power words to use freely: rahasya, ansuni kahani, chhupi sach, hairan, aisa sach,
      asli sach, jo kisi ne nahi bataya
    - Avoid pure English titles or descriptions
    - Avoid pure Devanagari script in title/description (use Roman/Hinglish for
      Indian-mobile discoverability)

    BRAND VOICE FOR CTA / SUBSCRIBE:
    Always use the channel name "Itihaasvani" verbatim. Example phrases:
    "Itihaasvani ko abhi Subscribe karein", "Itihaasvani parivaar mein jud jao".

  content_spec: |
    OUTPUT RULES — apply to every Itihaasvani Short, no exceptions.

    1. title (≤80 chars):
       - NO hashtags in title (hashtags ONLY in description)
       - Start with the character/topic name (for YouTube search ranking)
       - Include a curiosity hook or unresolved question
       - Hinglish (Hindi words in Roman script, e.g., "Karna ke Janam Ka Raaz")
       - End with EXACTLY 1 relevant emoji
       - Format: [Topic/Character] + [Hook/Question] + [Emoji]
       - Good examples:
         * "Karna ke Janam Ka Woh Raaz Jo School Mein Nahi Padhaya Gaya 🔥"
         * "Dronacharya Ne Eklavya Ka Angutha Kyu Maanga? Asli Sach 😱"

    2. description (≤900 chars, EXACT structure in this order):
       Line 1: Hook beginning with "Kya aap jaante hain..." + relevant emoji
       Line 2-3: 2-3 sentence teaser revealing just enough to hook but NOT the full answer
       Line 4: Engagement CTA — ask a debate/opinion question to drive comments
       Line 5 (verbatim): "Agar aapko bhi Bharat ke aise hi ansune itihaas aur pauranik
                          rahasya pasand hain, toh Itihaasvani ko abhi Subscribe karein!"
       Line 6 (verbatim, with the exact emojis and line breaks):
              "🔔 Daily uploads:
               ✨ 12 PM — Pauranik kathayein
               ✨ 9 PM — Itihaas ke chupe rahasya"
       Line 7 (verbatim): "📩 Business: gopulabs@gmail.com"
       Line 8: 12-15 hashtags

    3. hashtags (description-only, NEVER in title):
       Always include these 6: #Itihaasvani #ItihaasKeRahasya #SanatanDharma
       #BharatGatha #Shorts #YouTubeShorts
       Plus 6-9 topic-specific tags relevant to the character/story
       (examples: #Karna #Mahabharata #HinduMythology #AncientIndia).

    4. thumbnail text suggestion (3-5 bold Hindi/Hinglish words):
       - NOT a single word — must give partial context that hints at the twist
       - Example: "Angutha Maangne Ka Sach 😱" (good)
                  "Krur" (bad — too vague, no context)

    IMPORTANT: the JSON "title" field = the Hinglish title above (no hashtags).
    The JSON "description" field = the FULL 8-line block above including hashtags
    at the end. Hashtags should also appear as separate items in the "hashtags"
    JSON array (12-15 total, mix of always-include + topic-specific).
  image_style_guidance: |
    - Cinematic epic mood: chiaroscuro lighting, dramatic shadows, atmospheric depth.
    - Period-accurate: ancient Indian architecture (stone temples, palaces, fortresses), traditional weapons (bow, mace, sword), period clothing (dhoti, sari, armor).
    - Single dominant subject in 9:16 frame. Heroes, warriors, sages, deities.
    - Anatomically correct (two arms unless canonically more — Vishnu's 4 arms, Durga's 8/10 arms etc.).
    - Time/place hints: ancient Bharat, mountains, rivers, ruins, sacred groves.
    - NO modern elements (cars, buildings, clothing), NO text/watermarks.
  topic_guidance: |
    Topics include:
    - Mahabharata hidden facts (Karna's secrets, Eklavya, Ashwatthama, Barbarik)
    - Ramayana lesser-known stories (Urmila, Lakshman's tapasya, Ravana's library)
    - Lost kingdoms (Vijayanagara, Chola, Maurya, Maratha)
    - Mythological mysteries (Saraswati river, Dwarka submergence, Ram Setu, Kailasa temple)
    - Forgotten warriors and rulers (Lalitaditya, Bajirao, Rani Abbakka)
    - Hybrid mythology+science angles (Vimanas, Brahmastra theories)
    Avoid: religious controversy, political bias, modern politics, claims that disrespect any community.
    Frame as historical/mythological education, never devotional preaching.

publish:
  instagram: false
  privacy: public
  youtube: true

video:
  bitrate: 6M
  duration_target_sec: 50
  font: /System/Library/Fonts/Supplemental/Devanagari Sangam MN.ttc
  font_size: 72
  fps: 30
  height: 1920
  subtitle_box_opacity: 0.0
  width: 1080

voice:
  # provider: "edge" (free) or "elevenlabs" (premium — recommended for itihaas drama)
  provider: edge
  fallback_to_edge: true

  # Edge TTS (free)
  pitch: -5Hz
  rate: -2%
  shloka_pitch: -8Hz
  shloka_rate: -12%
  shloka_voice: hi-IN-MadhurNeural
  voice: hi-IN-MadhurNeural

  # ElevenLabs (premium) — Adam = deep dramatic male, perfect for storytelling
  elevenlabs_voice_id: pNInz6obpgDQGcFmaJgB
  elevenlabs_shloka_voice_id: pNInz6obpgDQGcFmaJgB
  elevenlabs_model: eleven_multilingual_v2
  elevenlabs_settings:
    stability: 0.45        # lower = more emotion/drama
    similarity_boost: 0.85
    style: 0.45            # higher = more characterful, dramatic
    use_speaker_boost: true
