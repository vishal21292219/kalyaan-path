niche: itihaas

branding:
  channel_handle: '@Itihaasvani'
  cta: "\U0001F4DC Itihaas ki awaaz suno — Subscribe Itihaasvani"
  ai_disclosure: "📜 Itihaasvani | Hand-researched stories, AI-assisted visuals, human-curated narration for authentic Indian history & mythology."
  hashtags:
  - '#itihaasvani'
  - '#itihaas'
  - '#mythology'
  - '#mahabharata'
  - '#ramayana'
  - '#hindumythology'
  - '#sanatan'
  - '#bharatkahistory'
  - '#shorts'
  - '#reels'
  - '#ancientindia'
  - '#puranas'
  music_credit: "Music: cinematic epic drone — original, royalty-free"

paths:
  topics_file: data/topics_itihaas.json
  music_dir: data/music_itihaas
  state_dir: data/state
  shloka_progress: data/state/itihaas_progress.json

secrets:
  youtube_client_secret: secrets/itihaas_youtube_client_secret.json
  youtube_token: secrets/itihaas_youtube_token.json

images:
  # PAID fal stack: flux/schnell (cheap, ~$0.003/img) + character consistency.
  # HF/Gemini stay as automatic fallbacks if fal ever errors.
  provider: fal
  model: fal-ai/flux/schnell
  gemini_image_model: gemini-3.1-flash-image-preview
  fallback_model: black-forest-labs/FLUX.1-schnell
  # Character consistency: 1 master portrait per recurring character → same
  # face/design across hero scenes (the pro look). Needs fal.
  consistency: true
  consistency_max_scenes: 3   # cost guard: only the top N hero scenes conditioned (0 = all)
  negative: text, watermark, logo, captions, signature, ugly, deformed, mutated, malformed limbs, extra fingers, extra arms, extra heads, missing limbs, distorted face, asymmetric face, melted features, broken anatomy, twisted body, blurry, low quality, cartoon, anime, chibi, modern clothing, modern buildings, cars, dark gloomy mood, underexposed, muddy colors, washed out
  num_per_reel: 10
  style_suffix: ', cinematic Indian mythology art, ultra realistic 3D rendering, anatomically correct (two arms, one head, five fingers per hand), single focal subject sharply in focus, BRIGHT vibrant warm lighting with golden volumetric rays, well-illuminated faces with clear expressions, rich saturated orange-saffron-gold color palette, polished masterpiece quality, Raja Ravi Varma painting style fused with modern cinematic concept art, period-accurate ornaments and clothing, vertical 9:16 portrait composition, ultra detailed 8K rendering, no text no watermark'

llm:
  language: hindi
  model: claude-sonnet-4-6
  provider: claude
  fallback_model: llama-3.3-70b-versatile
  persona: |
    You are a content writer for "Itihaasvani" (@Itihaasvani), a Hindi-first YouTube Shorts
    channel about Indian history, mythology, and Pauranik secrets. The target audience is
    Indians on mobile (primarily India, Hindi-speaking).

    CHANNEL NICHE:
    Mahabharata, Ramayana, Puranas, Vedic texts, lost kingdoms, forgotten warriors,
    mythological mysteries, and untold Indian history.

    TONE:
    - Hinglish throughout (Hindi meaning written in Roman script — NOT pure English,
      NOT pure Devanagari)
    - Conversational, emotional, storytelling-driven
    - Every video should feel like "a secret that was hidden from you"
    - Power words to use freely: rahasya, ansuni kahani, chhupi sach, hairan, aisa sach,
      asli sach, jo kisi ne nahi bataya
    - Avoid pure English titles or descriptions
    - Avoid pure Devanagari script in title/description (use Roman/Hinglish for
      Indian-mobile discoverability)

    BRAND VOICE FOR CTA / SUBSCRIBE:
    Always use the channel name "Itihaasvani" verbatim. Example phrases:
    "Itihaasvani ko abhi Subscribe karein", "Itihaasvani parivaar mein jud jao".

  content_spec: |
    OUTPUT RULES — apply to every Itihaasvani Short, no exceptions.

    1. title (≤80 chars) — VIRAL FORMULA absorbed from @priyanshshukla_007
       (1.76M subs, avg 1.7M views per Short, same niche):
       - NO hashtag-only spam in title, BUT MUST end with "#facts" hashtag
         (this is a brand+SEO signal proven across every viral hit)
       - MUST contain "😱" emoji placed at the COLON split point (ः or :)
         between the shock event and the topic descriptor — this is the
         single highest-signal pattern in the niche
       - MUST end with a relevant English keyword (e.g., "Krishna Story",
         "Mahabharat", "Gajasur Story", "Tirupati Mystery") right BEFORE
         the "#facts" hashtag — drives English-search SEO + brand signal
       - Structure (preferred): "[SHOCK EVENT]ः [Topic/Character] का सबसे
         [SUPERLATIVE] रहस्य! 😱 [English keyword] #facts"
         (Hinglish — Hindi words in Roman script, colon split, 😱, English
         tail keyword, then literal "#facts")
       - For AT LEAST 50% of titles, use Template 1:
         "Jab X ne Y kiya..." / "Jab X aaya..." (When X did Y / When X came)
         — this is their top-performing template (6.6M & 2.9M view hits)
       - Start with the character/topic name OR the shock event (both rank)
       - Avoid pure Devanagari OR pure English — strict Hinglish
       - Good examples (priyanshshukla-style — copy this pattern):
         * "Mahadev ko nigalne wala asurः Ganesh ji ke mastak ka sabse bada rahasya! 😱 Gajasur Story #facts"
         * "Jab Hanuman ji ki ek hunkaar se kaamp utha pura Kurukshetra! 😱 Mahabharat #facts"
         * "Krishna ke pote ka apaharanः Banasur ka ahankaar! 😱 Krishna Story #facts"
         * "Jab Tirupati Balaji ne Kuber se karz liya: Ansuna rahasya! 😱 Tirupati Mystery #facts"
         * "Dronacharya ne Eklavya ka angutha kyu maanga: Asli sach! 😱 Mahabharat #facts"

    2. description (~200-400 chars, MINIMAL — verified from @priyanshshukla_007 7M-view template):
       Line 1: Title repeated WITH "😱#facts" suffix (no space before #facts)
       Line 2-7: 6 keyword phrases describing the story (1 per line, English allowed)
                  Examples for "Hanuman vs Karna" video:
                    Hanuman vs Karna
                    Hanuman in Mahabharat
                    Krishna wounded by Karna
                    Arjuna's Chariot Flag
                    Hanuman Anger in Kurukshetra
                    Power of Hanuman
       Line 8: "Mahabharat Unknown Stories." (or topic equivalent)
       Line 9: 5 inline hashtags only: #temple #tourism #[character] #[epic] #dailyfacts

       NO bloat. NO "Your Queries" SEO block (that's outdated 2022 trick).
       NO long teaser paragraph. NO daily-uploads schedule line.
       NO Subscribe ask in description (CTA goes in video, not description).
       NO Business email in description.

       Total: 200-400 chars MAX. Verified from real 7M-view video template.

    3. hashtags (MINIMAL — verified from Priyansh top 5 viral videos):
       EXACTLY 5 hashtags ONLY, inline at end of description.
       Pattern: #temple #tourism #[main_character] #[main_epic] #dailyfacts

       Example for Hanuman/Mahabharat: #temple #tourism #hanuman #mahabharat #dailyfacts
       Example for Krishna/Ramayan: #temple #tourism #krishna #ramayan #dailyfacts

       DO NOT add Itihaasvani branding hashtags — verified that top creators DON'T.
       DO NOT add Shorts/YouTubeShorts hashtags — verified unnecessary.
       Keep it minimal — 5 broad tags only.

    4. thumbnail text suggestion (3-5 bold Hindi/Hinglish words):
       - NOT a single word — must give partial context that hints at the twist
       - Example: "Angutha Maangne Ka Sach 😱" (good)
                  "Krur" (bad — too vague, no context)

    IMPORTANT: the JSON "title" field = the Hinglish title above (no hashtags).
    The JSON "description" field = the FULL 8-line block above including hashtags
    at the end. Hashtags should also appear as separate items in the "hashtags"
    JSON array (12-15 total, mix of always-include + topic-specific).
  image_style_guidance: |
    - Cinematic epic mood: chiaroscuro lighting, dramatic shadows, atmospheric depth.
    - Period-accurate: ancient Indian architecture (stone temples, palaces, fortresses), traditional weapons (bow, mace, sword), period clothing (dhoti, sari, armor).
    - Single dominant subject in 9:16 frame. Heroes, warriors, sages, deities.
    - Anatomically correct (two arms unless canonically more — Vishnu's 4 arms, Durga's 8/10 arms etc.).
    - Time/place hints: ancient Bharat, mountains, rivers, ruins, sacred groves.
    - NO modern elements (cars, buildings, clothing), NO text/watermarks.
  topic_guidance: |
    PRIORITY (proven from this channel's own analytics):
    - REAL HISTORICAL FIGURES with a specific dramatic moment perform BEST
      (Bajirao Peshwa, Meera Bai, Rani Laxmibai, Shivaji, Chandragupta Maurya,
      Prithviraj Chauhan, Rana Pratap, Ahilyabai). Lead with the person + one
      jaw-dropping moment. School-curriculum + Bollywood overlap = built-in
      emotional investment.
    - Mahabharat/Ramayan ALSO work but ONLY via a SPECIFIC dramatic moment
      angle (Karna's birth secret, Eklavya's thumb) — NOT a vague theme.
    - DE-PRIORITISE generic "rahasya" topics that flopped here (Brahmastra
      power, "Hanuman aaj bhi zinda" sightings, 10-heads-of-Ravana) — these are
      oversaturated, low-trust, and scored 13–34 views. Avoid unless you have a
      genuinely fresh, specific angle.

    HIGH-POTENTIAL VEIN — TEMPLE MYSTERIES (proven: rival's biggest hits were
    temple-rahasya videos — Rajarajeshwar 7.5M, Tiruchendur 6M, Tirupati millions).
    Each = a SPECIFIC temple + a documented, jaw-dropping mystery. Strong bhakti+
    itihaas audience overlap → high share rate. Concrete candidates:
    - Padmanabhaswamy (Kerala) — the sealed Vault B no one dares open
    - Jagannath Puri — flag against the wind, no shadow, Sudarshan chakra illusion
    - Konark Sun Temple — the lost 52-ton magnetic lodestone
    - Brihadeeswara (Thanjavur) — 80-ton capstone, no-shadow gopuram
    - Kailasa (Ellora) — one rock, carved top-down, "machine" theories
    - Lepakshi — the hanging pillar that doesn't touch the floor
    - Kedarnath — why it survived the 2013 flood untouched
    - Tirupati Balaji — real hair, the karz/Kuber loan, sealed chamber
    - Brihadeeswara/Veerabhadra/Stambheshwar (tide-vanishing temple)
    Frame with the winning hook template (specific temple + one impossible fact).

    Other topic veins:
    - Lost kingdoms (Vijayanagara, Chola, Maurya, Maratha)
    - Mythological mysteries (Saraswati river, Dwarka submergence, Ram Setu, Kailasa temple)
    - Forgotten warriors and rulers (Lalitaditya, Rani Abbakka)

    WINNING HOOK TEMPLATE (use for the hook / body[0] of most videos):
      "[Specific naam] ne [specific action] kiya, aur [unexpected consequence]
       hua — yeh woh sach hai jo [school / itihaas ki kitaab / kisi] ne kabhi
       nahi bataya."
    Open on the dramatic MOMENT, never a generic "ek rahasya hai..." opener
    (that weak opener is why bottom videos got swiped in the first 3 seconds).

    Avoid: religious controversy, political bias, modern politics, claims that disrespect any community.
    Frame as historical/mythological education, never devotional preaching.

publish:
  instagram: false
  privacy: public
  youtube: true
  facebook: false  # PAUSED 2026-06-10: FB token failing ("cannot call API on behalf of user")
                   # — Meta flagged the dev account; failing calls worsen the flag. Re-enable
                   # after the account is confirmed + token re-generated (Itihaasvani).

video:
  bitrate: 6M
  hero_motion: false   # Kling v3 needs fal — OFF on free stack. Set true after recharge.
  duration_target_sec: 50
  sfx: true            # tension sound-design: impact boom on hook + whoosh risers into reveals
  heartbeat: true      # subtle heartbeat suspense bed (series episodes only)
  font: /System/Library/Fonts/Supplemental/Devanagari Sangam MN.ttc
  font_size: 72
  fps: 30
  height: 1920
  subtitle_box_opacity: 0.0
  width: 1080

voice:
  # provider: "edge" (free) or "elevenlabs" (premium — recommended for itihaas drama)
  # NOTE: elevenlabs free tier flagged this account (401 detected_unusual_activity);
  # using edge with slowed cadence + deeper pitch for storyteller feel.
  provider: edge
  fallback_to_edge: true

  # Edge TTS (free) — tuned for storyteller drama (slow + deep, but safe values)
  pitch: -8Hz
  rate: -8%
  shloka_pitch: -8Hz
  shloka_rate: -12%
  shloka_voice: hi-IN-MadhurNeural
  voice: hi-IN-MadhurNeural

  # Voice rotation pool — different voice per Telegram drop slot
  # (3 drops/day with seeds 1,2,3 → rotates across these 3 voices).
  # Anti-pattern detection: algo sees variety, not templated channel.
  # For long-form drops we pin a single dramatic male voice (override below).
  voice_pool:
    - hi-IN-MadhurNeural  # male, deepest — pinned for long-form drama

  # ElevenLabs (premium) — Adam = deep dramatic male, perfect for storytelling
  elevenlabs_voice_id: pNInz6obpgDQGcFmaJgB
  elevenlabs_shloka_voice_id: pNInz6obpgDQGcFmaJgB
  elevenlabs_model: eleven_multilingual_v2
  elevenlabs_settings:
    stability: 0.45        # lower = more emotion/drama
    similarity_boost: 0.85
    style: 0.45            # higher = more characterful, dramatic
    use_speaker_boost: true
