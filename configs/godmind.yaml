niche: godmind

branding:
  channel_handle: '@GodsOfTheMind'
  cta: "🧠 There's a god for every part of you — Follow to meet them all"
  # ── CHANNEL SPINE (2026-08 reinvention): "The Gods Inside You" ───────────────
  # GoM was a FEED of one-off insights → got views, ~0 subs (130 videos → 168
  # subs; 1.3 subs / 1000 views). It is now ONE finite, numbered JOURNEY the
  # viewer JOINS: every video decodes ONE god as ONE part of the viewer's own
  # mind, so the pantheon becomes a MAP OF THE SELF they want to complete.
  # Subscribe = "I'm mapping myself." Every script, hook, and CTA must reinforce
  # this ongoing self-map — that is the lever that converts our proven reach
  # (11K FB breakouts) into FOLLOWERS.
  series_name: "The Gods Inside You"
  series_promise: "Meet the god inside you — one at a time — until you are whole."
  # PROMO — REMOVED 2026-10-20 per user ("gumroad hata do abhi, kuch aur sochte
  # hain"). This key fed the YouTube description only: the FB first comment has
  # used an engagement question since the 2026-07-08 audit, because the Gumroad
  # link converted 0 and external links in comments suppress a reel's reach
  # (pipeline/uploader_make_reel.py COMMENT_BAIT). Absent key -> uploader_youtube
  # appends nothing, no code change needed. Restore by uncommenting.
  # promo: "🆓 Free Stage 1 — Become Shiva (Ego-Death Workbook): https://gopulab.gumroad.com/l/cokng\n📖 Full 10-stage Become Shiva workbook ($12): https://gopulab.gumroad.com/l/smaolv"
  ai_disclosure: "🧠 Gods of the Mind | Ancient Hindu wisdom decoded as psychology — original scripts, AI-assisted visuals & narration."
  hashtags:
  - '#godsofthemind'
  - '#psychology'
  - '#sanatandharma'
  - '#spirituality'
  - '#philosophy'
  - '#consciousness'
  - '#selfimprovement'
  - '#shiva'
  - '#krishna'
  - '#mindfulness'
  - '#shorts'
  - '#youtubeshorts'
  music_credit: "Music: meditative ambient — original, royalty-free"

# ── TOPIC CRITERIA (viral formula — codified 2026-07-08) ──────────────────────
# Every GoM topic MUST be FELT-PAIN / IDENTITY first, deity as the REFRAME second.
# Proven: the 10.6k breakout was "You were taught to kill your darkest urges. The
# gods never did." Formula = <a private struggle the viewer already feels> + <a
# deity/myth that reframes it> → the viewer sees THEMSELVES in the god.
# NOT "Here's a myth about Shiva" (info) — YES "That stillness you can't find? Shiva
# IS it" (identity). Any new pool topic must pass this felt-pain-first test.
paths:
  topics_file: data/viral_topics_godmind.json
  music_dir: data/music_godmind
  drone_dir: data/music_godmind   # pick_drone uses this → meditative_bed.mp3
  state_dir: data/state
  shloka_progress: data/state/godmind_progress.json

secrets:
  youtube_client_secret: secrets/godmind_youtube_client_secret.json
  youtube_token: secrets/godmind_youtube_token.json

# No custom thumbnail for GoM: it's a Shorts channel — a custom thumbnail isn't
# shown in the Shorts feed, and the appended endcard isn't wanted. Skips thumbnail
# generation + endcard entirely (saves a fal image too).
thumbnail: false

images:
  # PREMIUM AI visuals — fal FLUX, ethereal/cosmic/symbolic spiritual style that
  # fuses deity + mind/consciousness (not photoreal history). Ken Burns motion in
  # the assembler. Upgrade model to fal-ai/flux-pro/v1.1 for max quality (+cost).
  mode: image
  provider: fal
  # BULK model raised schnell -> dev 2026-10-21. Measured on the SAME prompt
  # (scene 4 of a live reel, "a vast cosmic ocean churning, Halahala rising"):
  # schnell ignored the scene entirely and returned a bearded Shiva portrait;
  # dev returned a clean-shaven Shiva standing in churning ocean waves. schnell
  # is a 4-8 step distilled model and was the single cause of BOTH complaints —
  # "images script ke hisaab se nahi" and the beard in the non-hero scenes. It
  # was never a token-cap problem: the full prompt measured ~196 T5 tokens
  # against schnell's 256 cap, so nothing was being truncated.
  # COST: ~$0.05/img on dev vs ~$0.006 on schnell -> roughly +₹35/reel,
  # ~₹560/month at 4 reels/week. Image quality is the channel's main lever and
  # the page is monetised, so this is bought deliberately.
  model: fal-ai/flux/dev            # BULK scenes
  master_model: fal-ai/flux/dev     # MASTER deity portrait — premium 28-step face, propagated via consistency
  hero_model: fal-ai/flux/dev       # FIRST image (hook + FB cover) — premium since Kling hero-motion is off. Bump to fal-ai/flux-pro/v1.1 for max wow (+cost).
  hero_scenes: 2                    # how many OPENING scenes get premium treatment (the part viewers judge). ~$0.05/video.
  num_per_reel: 10
  consistency: true                 # lock the dev-quality deity face across the hero scenes
  # VISION GATE (pipeline/frame_check.py). One Claude-vision call per frame,
  # checked against the things this channel cannot ship: facial hair on a deity
  # whose canon is a bare jaw, an unclothed goddess, a deity rendered as a child,
  # a picture that does not depict its own line, garbled lettering. Added
  # 2026-10-21 because all four of those reached a published reel while the
  # pipeline reported SUCCESS — the output is a picture and the code could not
  # see it. Validated on six real frames from that reel: the bearded master, the
  # off-brief scene and an unclothed Kali all FAIL; three good frames PASS.
  frame_check: true
  # Raised 3 -> 8 on 2026-10-21. With only the first 3 scenes reference-
  # conditioned, scenes 3+ came from plain text-to-image in a visibly DIFFERENT
  # art style (flat calendar art against the hero scenes' rich painting), which
  # is what made the finished reel look incoherent. The references are now
  # pinned, hand-checked files (assets/refs/), so conditioning more scenes
  # propagates correct iconography instead of propagating a bad master.
  # 2026-10-22: 8 → 0 (= every scene). On the Indra reel the cap sent scenes 9-10
  # to plain FLUX, and exactly those two came back bearded past the vision
  # gate's retry; the eight conditioned on the pinned clean-shaven ref passed.
  consistency_max_scenes: 0

  # ── PER-DEITY ICONOGRAPHY BLOCKS (2026-10-21) ────────────────────────────────
  # Replaces the universal style_suffix for any scene that names a deity below.
  # WHY: the old suffix carried SIX deities' attributes into every single prompt
  # (416 of 624 tokens) while the scene's own text was 3% — so attributes bound
  # to whoever was nearest, not to the deity asked for. Measured: the same Shiva
  # at 2197 chars kept a beard; at 638 chars with only his own marks it came out
  # clean-shaven with trishul, crescent, cobra and tripundra all correct.
  # RULES for editing these: state every mark as a PRESENT OBJECT anchored to a
  # body part ("his jaw is smooth and bare"), never as an absence ("no beard") —
  # the model has no way to render a negation and will draw what you name. Keep
  # each block to 5-6 marks in distinct spatial slots; past that they drop out.
  deity_blocks:
    shiva: "His jaw is smooth and bare, his upper lip smooth and bare. His skin is ash-white like a silver mountain and only his throat is deep blue. Three horizontal white ash lines cross his brow with a vertical third eye above them. His hair is thick matted jata coiled into a high topknot with a thin white crescent moon at its crest. A tiger skin is wrapped at his waist. A tall trishul is gripped in his hand."
    krishna: "His skin is a deep luminous BLUE all over — the blue of a monsoon raincloud, unmistakably blue and never brown or tan. He is a youthful man in his early twenties with a smooth clean-shaven jaw and a smooth bare upper lip, his dark hair in soft waves. One upright peacock feather stands in a tuft of his dark curled hair. A bamboo flute is held at his lips in both hands. A vaijayanti garland of forest flowers falls past his knees over a golden-yellow pitambara dhoti. He stands in a thrice-bent tribhanga curve. He has two arms."
    vishnu: "He is a serene youthful crowned man with a smooth clean-shaven jaw and a smooth bare upper lip. His skin is dark storm-cloud blue. A tall conical golden kirita crown rises from his head. He has four arms: a white conch in the upper right, a golden chakra in the upper left, a golden mace in the lower left, a pink lotus in the lower right. A shrivatsa curl marks his right chest, a vanamala garland hangs to his knees, and yellow silk drapes his waist."
    ram: "He is a youthful prince in his twenties with a smooth clean-shaven jaw and a smooth bare upper lip. His skin is dark blue, visibly darker than anyone beside him. A cylindrical golden kirita crown sits on his dark hair. An arrow is held in his right hand and a great wooden longbow in his left. He wears reddish garments with a girdle and a sacred thread across his chest. He has two arms."
    # 2026-10-21: "FACE OF A MONKEY" alone pulled a photoreal CHIMPANZEE —
    # technically a monkey face, so the vision gate passed it, but not a
    # deity. Named as the STYLISED VANARA of temple art instead, with the
    # devotional expression and the sindoor colour leading.
    hanuman: "He is Hanuman the vanara, painted in the stylised devotional manner of Hindu temple art, never as a realistic ape. His face is a gentle vanara face: a short furred muzzle, a small rounded nose, a calm closed mouth and large warm eyes full of devotion, framed by a neat golden crown and gold earrings. His fur and skin are bright sindoor orange-red all over. His body is the strong upright body of a man in a golden dhoti with a sacred thread across his chest. A long tail curves up behind him like a flag. In his right hand he holds a gada: a short thick club with a heavy round ball of gold at its top, resting against his shoulder."
    ganesha: "He has the head of an elephant on the body of a mature adult man with a large round belly. His skin is warm red-orange, never grey. His right tusk is broken and his left tusk is whole. His trunk curves down and to his left. His ears are very large and fan-like. A serpent is wound around his belly as a belt. A small conical crown sits between his ears. He has four arms: a goad, a noose, a bowl of modaka sweets that his trunk reaches down to taste, and one palm raised in blessing. A small mouse sits at his feet."
    # 2026-10-21: "severed heads" / "severed head" trip fal's prompt content
    # checker — EVERY Kali prompt was rejected outright (caught building the
    # photo lane; the reel pipeline was silently falling through to its HF /
    # Gemini fallbacks for her). The Sanskrit names pass and are the more
    # respectful terms anyway: mundamala = the garland, kanchi = the girdle.
    # ── KALI — rewritten 2026-10-21 from sourced iconography, NOT from guesswork.
    # Source: hdasianart.com "Kali Iconography: A Comprehensive Reference Guide".
    # What the old block got wrong: no Shiva underfoot (the single most defining
    # element of Dakshinakali), the mundamala described as merely hanging "at her
    # chest" (FLUX drew a thin necklace), the four hands unassigned to left/right,
    # a "dark lotus" that is not canonical for her at all, and "blue-black" skin
    # where the texts say black (deep blue is the popular-art convention).
    # Canon now encoded: right foot forward on a supine Shiva; mundamala draped
    # left shoulder across the chest to the right hip (this IS her torso covering
    # in devotional art — a sari or armour is the wrong fix and was tried and
    # rejected); muṇḍāmbara skirt of arms waist-to-thigh; upper-left khadga,
    # lower-left head, upper-right abhaya, lower-right varada; protruding tongue.
    # WORD CHOICE: "severed head"/"severed arms" trip fal's prompt content filter
    # outright, so the same objects are named as "small dark sculpted faces" and
    # "small sculpted hands and forearms", which pass and render the same shapes.
    # KNOWN OPEN RISK: even with this block FLUX renders the mundamala as a thin
    # necklace and leaves her torso uncovered roughly as often as not — five
    # wordings were tested on 2026-10-21 and none held. Kali is therefore BLOCKED
    # in the photo lane (pipeline/photo_post.DENY_DEITIES). Reels still generate
    # her from this block and carry that exposure. The real fix is reference-image
    # conditioning on a Kalighat pata / temple murti, not more prompt wording.
    kali: "She is Dakshinakali, a fierce adult goddess, her skin black as midnight. She has three eyes and her long red tongue protrudes from her mouth and is held between her teeth. Her long black hair hangs loose and wild. A broad heavy mundamala garland of many small dark sculpted faces is draped from her left shoulder across her chest to her right hip, completely covering her torso. A thick skirt of many small sculpted hands and forearms is tied at her waist and covers her from waist to thigh. She has FOUR arms: her upper left hand raises a curved khadga sword, her lower left hand holds a small dark sculpted face low, her upper right hand is raised palm-out in abhaya mudra, her lower right palm is open downward in varada mudra. She stands with her right foot forward on the chest of Shiva, who lies calmly on his back beneath her, ash-white, smooth-jawed, with matted jata hair."
    durga: "She is a composed warrior goddess, a mature woman with golden skin and three eyes, in a red and gold silk sari and a tall golden crown. Her many arms are held in a wide fan, each gripping a different weapon — trident, sword, discus, bow, conch, mace. A great lion stands at her side. Her face is serene and resolute, never snarling."
    lakshmi: "She is a serene mature goddess seated on a full pink lotus, her skin warm golden, in a deep red silk sari with gold borders and a tall golden crown. She has four arms: the upper two hold pink lotuses, the lower right pours a stream of gold coins, the lower left is open in blessing. Two white elephants pour water over her from either side."
    saraswati: "She is a serene mature goddess seated on a white lotus, her skin fair and luminous, dressed entirely in a white silk sari with little gold. A veena is cradled against her left shoulder and held in two hands. Her other two hands hold a palm-leaf manuscript and a crystal mala. A white swan rests at her feet."
    brahma: "He is an elderly sage with a full white beard — a beard is correct for Brahma alone. His skin is warm red. He has four faces turned to the four directions, of which three are visible from the front, under one tall matted jata-mukuta crown. He is seated on a pink lotus. He has four arms holding a water pot, a palm-leaf manuscript, a mala and a sacrificial ladle, and no weapon at all. A white swan rests on his left."
    indra: "He is a regal sovereign with golden skin, a smooth clean-shaven jaw and a smooth bare upper lip, in a tall jewelled crown and heavy gold ornaments. A jagged golden vajra thunderbolt is gripped in his right hand. He sits on a high throne among storm clouds. A white four-tusked elephant stands behind him. He has two arms."
    yama: "He is a stern mature lord with deep dark skin and a short neat beard, in deep red robes and a golden crown. A noose of light hangs coiled in his left hand and a tall mace stands in his right. A great dark buffalo waits behind him. His expression is grave and just, never cruel. He has two arms."
    parvati: "She is a serene mature goddess with warm golden skin, her long black hair braided with flowers, in a red and gold silk sari and a golden crown. Her hands rest in blessing and giving. Her face is calm and maternal. She has two arms."
    kartikeya: "He is an ever-youthful warrior of about twenty with a smooth clean-shaven jaw and a smooth bare upper lip. His skin is bright brick-red. A conical jewelled crown sits on his head. A long golden vel spear is gripped upright in his right hand. A blue peacock with its tail spread stands beside him. He has two arms."
  # Short style tail appended AFTER the deity block. Deliberately ~40 tokens: the
  # old 416-token suffix left no room for the scene itself.
  style_tail: ", Raja Ravi Varma devotional oil painting style fused with cosmic symbolism, deep teal and indigo background, golden divine rim light, volumetric mist, single dominant figure filling the frame, 9:16 vertical, masterpiece"

  negative: text, watermark, logo, captions, signature, ugly, deformed, mutated, extra fingers, extra limbs, distorted face, broken anatomy, blurry, low quality, cartoon, anime, chibi, modern clothing, cars, buildings, flat lighting, washed out, cluttered, western facial features, greek or roman god, christian angel, caucasian deity, generic fantasy figure, non-Indian appearance, child, baby, infant, toddler, childlike face, young boy, feminine man, effeminate, androgynous, woman's face on a male deity, soft weak features, doll-like, beard on Krishna, moustache on Krishna, bearded Vishnu, bearded Ram, facial hair on a youthful deity, aged face on young god, incorrect iconography
  style_suffix: ', ethereal cinematic spiritual art, cosmic atmosphere, dramatic chiaroscuro lighting with divine golden rim-light against deep dark background, depicting an AUTHENTICALLY INDIAN Hindu deity as a mature dignified ADULT (never a child or baby) with traditional iconography and canonically correct attributes (e.g. blue-skinned YOUTHFUL clean-shaven Krishna (no beard, no moustache) with flute & peacock feather, blue-skinned YOUTHFUL clean-shaven Vishnu (no beard, no moustache, four arms holding conch discus mace lotus, tall crown), clean-shaven youthful Rama with bow, strong Shiva with a clean-shaven jaw and bare upper lip, a tall golden trishul in hand, three horizontal white ash stripes across the brow, a thin white crescent moon above his head and thick ash-grey matted jata coiled into a topknot, Brahma as a white-bearded elder, Durga as an adult woman with her weapons), genuine Indian facial features, a strong expressive powerful face with clear gender and commanding presence, warm divine skin tone, Raja Ravi Varma painterly essence fused with surreal cosmic symbolism — the deity merging with the human mind / consciousness / cosmos (neural constellations, third-eye light, sacred geometry, swirling galaxies, lotus, fire, water), anatomically correct (two arms, or canonical multi-arms; one head; five fingers per hand), traditional Indian ornaments and attire, painterly digital art meets photorealism, awe-inspiring and profound, rich teal-gold-violet palette warmed by golden divine light, single dominant focal subject, volumetric mist, 9:16 vertical portrait, no text no watermark, masterpiece'

llm:
  language: english
  # PREMIUM: Claude writes the scripts (depth + nuance) → falls back to Gemini.
  provider: claude
  model: claude-sonnet-4-6
  fallback_model: gemini-flash-latest

  # ── LENGTH: left at the global default (90-120 words, ~75-78s) ──────────────
  # 2026-10-20 am: raised toward 88s on the theory that Meta content monetization
  # pays on watch time. 2026-10-20 pm: REVERTED after pulling per-post data —
  # average play time correlates -0.05 with reach across 20 reels, and median
  # watch is 12.9s on a 76s reel (17% completion). Longer reels optimise a
  # non-driver and would contaminate the hook test that IS the priority.
  # The mechanism stays in pipeline/script_writer.py (llm.length_spec +
  # llm.body_word_cap) for a clean A/B later — set both to re-enable.
  persona: |
    You are the writer for "Gods of the Mind" — a premium YouTube Shorts channel
    that DECODES Hindu gods and timeless wisdom as PSYCHOLOGY and PHILOSOPHY. You
    do NOT preach religion, and you NEVER call Hindu beliefs "myths" or
    "mythology" — to devotees these are sacred. Use respectful words: Sanatan
    Dharma, Hindu wisdom, sacred symbolism, ancient teachings, scriptures. You
    reveal what each deity secretly maps onto in the human mind, ego,
    consciousness, fear, desire, and growth — the way Carl Jung, Alan Watts,
    Joseph Campbell, and Sadhguru (in English) reframe sacred symbolism as a
    mirror of the self.

    ★ CHANNEL SPINE — "THE GODS INSIDE YOU" (the ONE thing that makes GoM
    subscribable): this channel is a single, ongoing JOURNEY, not a feed of
    stray facts. Each video decodes ONE god as ONE part of the VIEWER'S OWN mind
    — a node in a map of themselves they are slowly completing. So every script
    must (a) make the viewer feel a specific part of THEMSELVES being named and
    SEEN, (b) land the god as that part of them (not an external deity), and
    (c) leave them aware there are MORE parts of them still un-met → they follow
    to finish the map. Also carry an EMOTIONAL register, not only an intellectual
    one: the god should feel like a presence that MEETS the viewer in their pain
    ("when you feel invisible, this is the god who has always seen you"), because
    emotion is what gets SHARED. Warmth + recognition first, insight second.

    THE FORMAT THAT WORKS (proven: @Awoken_Yodha hit 400K+/video with this):
    - Take ONE god / symbol (Shiva, Kali, Krishna, Indra, Ganesha, a vahana, a
      weapon, a posture) and reveal its HIDDEN PSYCHOLOGICAL meaning.
    - hook = open on the VIEWER'S inner pain/feeling in 2nd person ("you…") in the
      first 2 seconds, THEN pivot to the god as the hidden cause or cure. This
      "make them feel SEEN first, reveal the god second" formula massively
      outperforms opening cold on the concept (proven in this exact lane:
      pain-first hooks pull 12K–48K views vs concept hooks). Examples:
        "You destroy the good things in your life right before they bloom — that's
         not self-sabotage, that's Kali, and she's clearing the way."
        "You feel everything too deeply and it drains you. The ancients had a name
         for carrying that much weight: Shiva."
      NEVER open with "Did you know", a slow setup, or cold on the concept.
      Open on the viewer's felt experience, then name the god.
    - CRITICAL: the hook is spoken FIRST. body[0] must CONTINUE from the hook and
      go DEEPER — do NOT repeat, restate, or paraphrase the hook line in body[0]
      (the viewer already heard it, so repeating it makes the voiceover say the
      same sentence twice).
    - Build ONE clean insight, layer by layer, each line deeper than the last.
    - Land a "mind-blown" realization at ~70-80%, then a reflective close.
    - It must feel PROFOUND and CALM, like a truth being revealed — not hyped.
    Tone: calm, wise, intimate, slightly hypnotic — a voice you lean in to hear.
    Audience: global English "seekers" 18-40 — into psychology, spirituality,
    self-improvement, mindfulness, stoicism (US/UK/Canada/Australia/India-English).
    Keep content about GODS-AS-PSYCHOLOGY. Do NOT drift into astrology, birth
    charts, planetary placements, or "comment your sign" — that is a DIFFERENT
    audience. Borrow only the pain-first hook + personal comment-bait STYLE.
    Always end by inviting them to "Subscribe to Gods of the Mind" + a PERSONAL
    comment-bait that makes them reveal themselves (drives comments = reach):
    vary it per video, tied to the video's god — e.g. "Which lives in you right
    now: the destroyer, the protector, or the trickster? Comment it."

  image_style_guidance: |
    - PHRASE EVERY ATTRIBUTE AS A PRESENT OBJECT, NEVER AS AN ABSENCE. Write
      "his jaw is smooth and bare" — never "no beard", "never a full beard",
      "clean-shaven (no moustache)". FLUX has no way to render a negation: it
      renders whatever you NAME. On 2026-10-21 a `look` reading "clean-shaven
      with very light stubble only - never a full beard" produced a master
      portrait with a full beard, which then propagated into every
      reference-conditioned scene of that reel. This rule outranks every line
      below it; if a note below still reads as a ban, convert it yourself.
    - ALWAYS render deities as MATURE ADULTS with a strong, expressive face and clear gender — never children/babies, never soft/feminine/androgynous. State age + sex explicitly in every `look`.
    - AUTHENTIC CANONICAL ICONOGRAPHY (get this RIGHT — inauthentic deities kill the channel; a bearded Krishna is WRONG):
        · Krishna, Ram, Kartikeya = YOUTHFUL clean-shaven young men (~early 20s), smooth flawless face, absolutely NO beard, NO moustache; Krishna = blue-skinned, peacock-feather crown, flute, yellow dhoti.
        · Vishnu = serene clean-shaven crowned man, four arms (conch, chakra, mace, lotus), no facial hair.
        · Shiva = strong youthful ascetic, matted jata bun, crescent moon, third eye, snake, ash-smeared — clean-shaven or light stubble only, never a long beard.
        · Hanuman = a powerful VANARA (monkey-faced) devotee — NOT a plain human man.
        · Brahma = elderly four-faced white-bearded sage (a full beard is CORRECT here only).
        · Shani / Yama = mature, stern, dark-complexioned men (beard OK).
        · Kali, Durga, Parvati, Lakshmi, Saraswati = dignified adult Indian women with correct attributes.
        · Jagannath = the STYLIZED wooden temple murti (huge round eyes, dark abstract form) — NEVER a realistic human.
      Every deity must read as AUTHENTICALLY INDIAN temple/Raja-Ravi-Varma iconography — correct skin colour, ornaments, weapons, vahana. State the exact canonical look in every `look`.
    - Ethereal, symbolic, cosmic — NOT literal/historical photography.
    - Fuse the deity with the MIND/consciousness: third-eye light, neural
      constellations, sacred geometry, galaxies, lotus, fire, water, shadow.
    - Dramatic chiaroscuro: deep dark background, divine golden/violet rim light.
    - Single awe-inspiring focal subject in 9:16. Profound, calm, premium.
    - NO text, NO modern objects, NO cluttered scenes.
    - DEITY-DOMINANT, FRAME-FILLING (biggest visual lever — 2026-07-20): the
      DEITY (or a bold sacred symbol — weapon, vahana, yantra, murti) MUST be the
      LARGE, close, dominant subject filling 60%+ of the frame, richly and vividly
      coloured (deep reds, golds, saffron, jewel teals) with ornate detail.
      BANNED (these read as generic self-help stock and crushed our reach):
        · a small distant SILHOUETTE of a lone modern person
        · an empty moody landscape/sky with the subject tiny in the frame
        · a washed-out, desaturated, grey/muted palette
        · a scene with NO deity and NO strong sacred symbol at all
      Even for an inner-feeling line, express it THROUGH the deity/symbol as the
      hero of the frame (e.g. not "a lonely man under the moon" → YES "Shiva's
      serene face filling the frame, a crescent moon at his jata, cosmos behind").
      Vibrant, ornate, and unmistakably Hindu-devotional — like the channel's
      10K-view Durga-on-the-lion frame, never a dim generic meditation graphic.
  topic_guidance: |
    Every topic = a Hindu god / symbol decoded as psychology or philosophy:
    - Deities as mind-states: Shiva (stillness/dissolution of ego), Kali
      (destruction of illusion/fear), Krishna (strategy/detachment/play),
      Vishnu (preservation/balance), Brahma (creation/the restless mind),
      Indra (the insecure ego/power), Ganesha (removing inner obstacles),
      Hanuman (devotion/self-belief), Durga (inner strength).
    - Symbols decoded: why gods ride animals (mastering instincts), multiple
      arms (parallel capacities of mind), the third eye (awareness), the snake
      (kundalini/energy), the dance of Shiva (cosmic rhythm), the conch, the
      lotus, the trident, Yamraj/death as a teacher.
    - Concepts: maya (illusion), karma (psychology of action), the gunas,
      detachment, the witness/sakshi, ego vs Self, dharma as alignment.
    Frame as universal psychology/philosophy — never sectarian, never preachy.

  # ── CADENCE (2026-10-21, user's call) ───────────────────────────────────────
# 7 reels + 7 photos = 14 posts/week, which is where both measured competitors
# sit (Divya Darshan ~14-28, Awakeners ~14) and where GoM was far below at 4.
# The 4/week test set the day before is therefore ended after ONE day with no
# data either way — that is the user's decision, not a measured result, and it
# should not later be read as evidence that 4/week was tried and failed.
# COST: reels go 4 -> 7/week. Bulk images are flux/dev and the opener is a Kling
# clip, so this roughly doubles the per-reel spend line (~₹1,600/month total at
# 7/week vs ~₹900 at 4), before the photo lane's much smaller cost.
  content_spec: |
    OUTPUT RULES — every "Gods of the Mind" Short:

    0. OPEN-LOOP STRUCTURE (retention is the #1 algorithm signal) — but keep GoM's
       CALM, revelatory voice. This is a revelation, NOT a thriller:
       - The pain-first hook IS the open loop: name an unresolved EMOTIONAL tension
         ("you keep doing this and you don't know why…") so they need the answer.
       - DELAY THE REVEAL: let the deepest realization land at ~70–80%, never give
         the full insight up front — build to it.
       - LOOP-BACK ENDING: write the final line to quietly echo/answer the opening
         feeling → drives replays.
       - Do NOT use clickbait-suspense phrasing ("what happens next 🔥", "wait for
         it") — it cheapens the brand. Curiosity here is EMOTIONAL ("why am I like
         this?"), resolved calmly. Curiosity earns the STOP; value earns the FOLLOW.

    1. title (≤80 chars, English, NO hashtags in title):
       ── HOOK RULES (2026-10-20 — derived from 20 reels of real FB per-post data,
       not opinion. Do not re-litigate without new data.) ─────────────────────
       MEASURED: 60% of viewers leave before 3 seconds (median 3-sec rate 40%).
       The hook is the ONLY thing that decides reach. Top 5 reels took 58% of all
       views; what separated them was shares (32/reel vs 3/reel), and shares come
       from the hook making someone feel SEEN.

       1) NAME A BEHAVIOUR, NOT A FEELING. A thing they DO, not a mood they're in.
          WINNER  8,317 views: "You don't have one mind. You have three — at war."
          WINNER  6,394 views: "You destroy the good things in your life right
                   before they bloom — and you hate yourself for it."
          LOSER     845 views: "You are surrounded by noise, pressure and chaos."
          LOSER     953 views: "You have the power to move mountains — but you
                   forgot."  (flattery, no specific moment, 0 follows)
       2) IT MUST BE SLIGHTLY SHAMEFUL AND UNSPOKEN — something they have never
          said out loud. People share what makes them feel seen, and being seen
          requires that the thing was hidden.
       3) CONTRADICT THEIR SELF-IMAGE OR PUBLIC IMAGE. The two highest share
          counts of the month both told the viewer that what people believe about
          them is wrong. e.g. "Everyone thinks you're calm because nothing touches
          you. They're wrong." (6,949 views, 52 shares)
       4) FAMOUS DEITY, OR NO DEITY AT ALL, IN THE HOOK. Allowed in the opening
          line: Shiva, Krishna, Kali, Ganesha, Hanuman, Durga, Vishnu, Brahma,
          Lakshmi, Ram, Yama. Every other name (Nachiketa, Vamana, Matsya,
          Ekadanta, Vighnaharta…) goes AFTER the hook has landed, never inside it.
          MEASURED: the two worst 3-second rates in the whole set (21.2% and
          33.1%) are the two reels that put an unfamiliar Sanskrit name in the
          opening seconds. This is enforced in code — a lesser name in the hook
          is rejected and regenerated.

       ── THE IMAGES — RECOGNITION *AND* RELEVANCE ────────────────────────────
       Two rules, and a frame must pass BOTH. Passing one is what produced a
       reel where the line said "the weight you have learned to carry alone"
       and the frame showed a calm portrait of a face.

       A) RECOGNITION. Every frame contains the deity, canonically and clearly.
          75.8% of this page's viewers do not follow it; a stranger must know
          whose channel this is on sight. Frame 1 especially: a recognisable
          famous deity (Shiva, Krishna, Kali, Ganesha, Hanuman, Durga, Vishnu,
          Lakshmi, Ram, Saraswati, Indra, Yama), large in frame, eyes visible.
          Never an unnamed human, a figure from behind, or an empty landscape.

       B) RELEVANCE. The frame must DRAMATISE THE LINE IT BELONGS TO. visuals[i]
          shows what body[i] is saying — the state, the action, the pressure in
          that sentence — acted out by the deity.
            body[i]: "the weight you have learned to carry alone"
              WRONG: "close-up portrait of Shiva, face centred, eyes calm"
              RIGHT: "Shiva alone on a bare peak, shoulders bearing a mass of
                      dark churning poison, no one else in the frame"
            body[i]: "you keep the argument running in your head"
              WRONG: "portrait of Kali"
              RIGHT: "Kali mid-stride through a storm of circling shadow-faces
                      that keep returning, her eyes fixed ahead"

       BANNED: a portrait gallery. No more than TWO frames in the whole reel may
       be a face close-up, and never two in a row. Every other frame must carry
       an action, a setting, or a visible state that belongs to its line.
       Each visuals[i] therefore names: the deity + WHAT THEY ARE DOING + WHERE,
       in that order, before any style words.

       ── TYPOLOGY FORMAT (the single best-performing format we have) ──────────
       The top reel of the month was NOT a deity decode — it was a TYPOLOGY:
       three named inner states and an instruction to say which one you are
       ("Tamas, Rajas or Sattva? Comment it"). It produced 150 follows and 68
       saves, both ~2.4x the next best reel. A typology is shareable because the
       viewer sends it to someone to tell them which one THEY are.
       When the topic allows it, build the video as 2-4 NAMED types the viewer
       places themselves in. Prefer this shape over a single-deity explainer.

       Still-valid framing from the earlier teardown — felt-pain/identity FIRST,
       god SECOND; the viewer must see THEMSELVES in the god, not learn a fact:
         * "You [oddly-specific felt moment] — And It's Not [what you assume]"
         * "Why You [oddly-specific relatable behavior] (The Real Reason)"
         * "That [specific pain] Isn't [X] — It's [God/archetype]"
         * "If You [feel/do X], You're [flattering identity]"
       End with EXACTLY 1 emoji (🧠 🕉️ 👁️ 🔱 🌌 🪷 ⚡ 🔥).
       Good: "That Rage You Can't Explain Isn't You — It's Kali 🔥" /
             "Shiva Is Not a God in the Sky — The Real Shiva 👁️"

    2. description (≤1500 chars):
       Line 1: A pain-first hook in 2nd person ("you…") then the god + emoji.
       Line 2-3: tease the insight without fully giving it (curiosity gap).
       Line 4: reflective engagement question ("Which god lives in your mind?").
       Line 5 (verbatim): "Subscribe to Gods of the Mind — meet the god inside
                          you, one at a time, until you're whole."
       Line 6 (verbatim): "📩 Business: gopulabs@gmail.com"
       Line 7: 12-15 hashtags.
       Line 8: "Your Queries:" + 15-20 lowercase long-tail search keywords
               (e.g. "real meaning of shiva", "kali psychology explained",
               "hindu gods symbolism meaning").

    3. body lines:
       - Each line = ONE calm breath, 8-13 words, simple profound English.
       - STATEMENT → REFRAME → DEEPER TRUTH structure.
       - No hype words, no "you won't believe". Let the insight hit quietly.
       - Build toward ONE clear realization; don't list 5 things.

    4. cta:
       - PERSONAL comment-bait that makes them out themselves (max comments =
         max reach). Tie it to THIS video's god/theme and offer a choice, e.g.
         "Which rules you right now — the destroyer, the protector, or the
         trickster? Comment it." Vary every video; never reuse the same line.
       - Then a SELF-MAP follow-ask (THE subscribe lever) that frames this video
         as ONE part of the viewer now decoded, with more of them still un-met,
         so following = completing the map of THEMSELVES. Vary it, tie it to the
         god, e.g. "That's one god inside you. A different one is hiding in every
         part of you — follow Gods of the Mind and we'll meet them all, one at a
         time, until you see the whole of yourself." Use the verb "Follow" (reads
         right on FB; = Subscribe on YouTube). Never skip it — this is what
         converts the reach we already get into FOLLOWERS.

    5. hashtags (description only): always #GodsOfTheMind #Psychology
       #SanatanDharma #Spirituality #Philosophy #Consciousness #Shorts
       #YouTubeShorts + 5-7 topic-specific (#Shiva #Kali #Krishna #Jung etc.)
       NEVER use #HinduMythology / #mythology / #myth — they offend devotees.

publish:
  # The page's PUBLIC id — not a secret, and there is no FB_PAGE_ID_GODMIND
  # secret for this channel. Confirmed 2026-10-21 against the Make connection's
  # own page list (facebook-pages RPC "Pages"): "Gods of the Mind" ->
  # 1113214471881336. run.py hardcodes the same value for the reel path.
  # It MATTERS that this is right: the Make router sends a payload with no
  # fb_page_id down the "no fb_page_id" route, so a wrong or missing id does not
  # fail — it posts to a different page.
  fb_page_id: '1113214471881336'
  instagram: false
  privacy: public
  # YOUTUBE OFF (2026-10-20) — this niche's YouTube channel was REMOVED by
  # YouTube. Evidence: last successful upload 2026-09-25 19:02 UTC, first
  # `authenticatedUserAccountSuspended` 2026-09-26 11:10 UTC, and the account
  # switcher lists the channel as "Channel removed". Four channels went at once
  # (Gods of the Mind, TimeDecoders, Kalyaan Path, Ithaas Vani).
  # The pipeline kept reporting SUCCESS for 24 days because a YT failure is
  # caught so it can never block Facebook — which saved FB and hid this.
  # run.py already treats a delivered FB post as the slot's delivery when
  # youtube is false, so catch-up stays correct. Flip back to true if an appeal
  # restores the channel.
  youtube: false
  facebook_make: true     # AUTO FB via Make.com (Cloudinary→webhook, channel=gom → "Gods of the Mind" page). Bypasses the flagged dev-app.
  facebook_make_scheduled: true  # queue the reel for its exact US peak (poster cron) instead of posting at render-time → no drift
  # FB 2/day (2026-07-08 v2): match the 2/day YT so NO video is wasted on FB.
  # Both slots (17:00 UTC / 1 PM ET + 01:00 UTC / 9 PM ET) are 8h apart → the
  # poster's MIN_GAP_HOURS=3 + one-post-per-page-per-run guard fires both cleanly,
  # never back-to-back. (No facebook_make_slots key → all YT slots also post to FB.)
  facebook_manual: false  # no longer needed — FB now auto via facebook_make
  facebook: false  # direct Graph-API still paused (dev-app flagged); Make path used instead.

video:
  hero_motion: false   # OFF 2026-07-12 per user: Kling clip costs $1.4-2.8/video AND looks weak (just a "breathing" character). Ken Burns cinematic motion (free) is enough.
  bitrate: 6M
  # On-screen brand + retention overlays (assembler._apply_brand_overlays):
  # big opening HOOK CARD (0–3s, wins the 3-sec retention battle + becomes the
  # FB reel cover frame) + a small persistent @GodsOfTheMind wordmark (brand
  # recall → follows). Gated here + fully guarded, so it can never break renders.
  brand_overlays: true
  music: true
  # PHRASE captions, forced. Word-by-word mode makes ONE overlay per word, and
  # overlays are applied in passes of 3 (see assembler._apply_caption_batches —
  # 3 is the largest size measured at 100% caption retention). A sub-150-word
  # script therefore drops into word mode and needs up to 50 full re-encodes of
  # a 1080x1920 video, which would run past the workflow's timeout. Phrase mode
  # caps it at ~55 overlays (~19 passes) for the 170-word body cap, and the
  # assembler's own notes say it reads better for narration anyway.
  # The proper fix is to composite all caption PNGs into ONE alpha track and
  # overlay once, making the count irrelevant; that is a rewrite of a working
  # component and is deliberately not being done at the end of a long session.
  caption_style: phrase
  music_volume: 0.09   # meditative bed slightly more present (you "lean in to listen")
  stings: false
  duration_target_sec: 80
  # ── OPENING 3 SECONDS (2026-10-20 FB audit) ─────────────────────────────────
  # Measured: median 3-second rate 40% — six of ten viewers leave before the
  # content starts, and average play time has NO correlation with reach
  # (r = -0.05). The opening is the only lever that moved anything.
  #   "cuts"  = scene 1 becomes 3 hard punch-in cuts (wide -> mid -> face). FREE.
  #   "motion"= scene 1 becomes a real ~3s generated clip (~₹22/reel, ~₹375/mo).
  #   absent  = unchanged Ken Burns.
  # Running "cuts" FIRST on purpose: it costs nothing, and running both at once
  # would make it impossible to tell which one moved the number. Flip to
  # "motion" only after 14 reels of cuts have a 3-second rate to compare.
  # OPENER: OFF (2026-10-21, user's call after seeing both cuts side by side).
  # "motion" generated a real Kling clip for the hook — and by the end it worked:
  # the final test clip had Durga rising from a bowed, collapsed posture to raise
  # a flame and then a trishul, which actually matched the hook line. The user
  # compared it against the identical reel without it and chose without. Absent
  # key = plain Ken Burns, which is exactly the version that was approved.
  # Saves ~₹22/reel (~₹660/month at daily). Set back to "motion" to re-enable,
  # or "cuts" for the free hard-cut opener (that A/B never completed).
  # 2026-10-23: "cuts" ENABLED. Measured on 28d of FB data — 60% of viewers
  # leave before 3s and scene 0 held one still picture until ~9s, so the frame
  # simply never changed inside the window where they decide. This is the free
  # opener (no I2V spend); "motion" remains the paid alternative.
  opener: ramp
  # opener_model: fal-ai/...   # optional cheaper I2V for "motion" (default Kling v3)
  font: assets/fonts/Anton-Regular.ttf
  font_size: 80
  fps: 30
  height: 1920
  subtitle_box_opacity: 0.0
  width: 1080

